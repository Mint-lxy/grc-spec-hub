    delete: { tags: [Inbound PAT Management], operationId: deletePat, summary: 删除 PAT, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/VoidEnvelope' } } } } } }
  /mgmt/vault/inbound/tokens/{id}/regenerate:
