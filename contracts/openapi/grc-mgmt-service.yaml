    get: { tags: [Vault Audit], operationId: queryVaultAudit, summary: 查询凭据审计日志, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
    DirectoryId: { name: directoryId, in: path, required: true, schema: { type: integer, format: int64 } }
    KnowledgeBaseId: { name: kbId, in: path, required: true, schema: { type: string } }
    DocumentId: { name: docId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
    StageType: { name: stageType, in: path, required: true, schema: { type: string } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string } }
    FlowId: { name: flowId, in: path, required: true, schema: { type: string } }
    StepId: { name: stepId, in: path, required: true, schema: { type: string } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, schema: { type: string } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    PermissionId: { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }
    CredentialId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    TargetType: { name: targetType, in: path, required: true, schema: { type: string } }
    TargetId: { name: targetId, in: path, required: true, schema: { type: string } }

  responses:
    SessionNotFound:
      description: sessionId 不存在、已删除，或不属于该请求用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string, const: '0', description: '0=成功；失败时使用已注册的服务前缀错误码' }
        message: { type: string, const: success }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    GenericRequest:
      type: object
      additionalProperties: true

    GenericResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data: {}

    DirectoryTreeResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              type: object
              required: [public, personal]
              properties:
                public:
                  type: array
                  items: { $ref: '#/components/schemas/DirectoryTreeNode' }
                personal:
                  type: array
                  items: { $ref: '#/components/schemas/DirectoryTreeNode' }

    DirectoryTreeNode:
      type: object
      required: [id, name, directoryType, children, permissionItems]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId: { type: [integer, 'null'], format: int64 }
        path: { type: string }
        childrenCount: { type: integer }
        kbCount: { type: integer }
        directoryType: { type: string, enum: [PUBLIC, PERSONAL] }
        aliceSyncStatus: { type: [string, 'null'] }
        permissionItems:
          type: array
          items: { $ref: '#/components/schemas/DirectoryPermissionItem' }
        children:
          type: array
          items: { $ref: '#/components/schemas/DirectoryTreeNode' }

    DirectoryPermissionItem:
      type: object
      required: [permissionCode, permissionName, granted, canApply]
      properties:
        permissionCode: { type: string, enum: [DIR_CONTROL, KB_CREATOR] }
        permissionName: { type: string }
        roleId: { type: [string, 'null'] }
        entitlementId: { type: [string, 'null'] }
        granted: { type: boolean }
        canApply: { type: boolean }
        applyUrl: { type: [string, 'null'] }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
        traceId: { type: string }

    ChatSessionSummary:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        assetId: { type: [string, "null"] }
        assetName: { type: [string, "null"] }
        title: { type: string }
        modelId: { type: [string, "null"] }
        lastMessageAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ChatSessionSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionSummary' }

    ChatSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ChatSessionSummary' }
                total: { type: integer }

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              knowledgeBaseId: { type: string }
              docId: { type: string }
              chunkId: { type: [string, "null"] }
              content: { type: string }
              score: { type: number, format: float }
        toolCalls:
          type: array
          items:
            type: object
            properties:
              toolName: { type: string }
              arguments: { type: object, additionalProperties: true }
              resultSummary: { type: string }
        thinkingProcess:
          type: [string, "null"]
          description: 深度分析模式下的思考过程（可折叠有序步骤，格式待细化）
        createdAt: { type: string, format: date-time }

    ChatSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            knowledgeMounts:
              type: array
              items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionDetail' }

    KnowledgeMount:
      type: object
      required: [knowledgeBaseId, name]
      properties:
        knowledgeBaseId: { type: string }
        name: { type: string }
        directoryPath: { type: [string, "null"] }
        snapshotAt: { type: [string, "null"], format: date-time }

    KnowledgeMountsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [mounts]
              properties:
                mounts:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionContext:
      type: object
      required: [sessionId, knowledgeBaseIds]
      properties:
        sessionId: { type: string }
        knowledgeBaseIds:
          type: array
          items: { type: string }
          description: 已通过权限校验、当前生效的挂载知识库 ID 列表
        modelId: { type: [string, "null"] }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              citations:
                type: array
                items: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }

    ChatSessionContextEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionContext' }

    AppendMessageRequest:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { type: object, additionalProperties: true }
        toolCalls:
          type: array
          items: { type: object, additionalProperties: true }
        thinkingProcess: { type: [string, "null"] }

    AppendMessageResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [messageId, createdAt]
              properties:
                messageId: { type: string }
                createdAt: { type: string, format: date-time }

    ResolveModelResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [resolved, credential, source]
              properties:
                resolved: { type: boolean }
                credential:
                  type: object
                  required: [type, token]
                  properties:
                    type: { type: string, enum: [bearer, api_key] }
                    token: { type: string }
                source:
                  type: string
                  enum: [personal, platform_default]
                availableModels:
                  type: array
                  items: { type: string }
