    CreateUploadSessionResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CreateUploadSessionResponse', description: 响应数据 } } }] }
    BatchCreateUploadSessionResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/BatchCreateUploadSessionResponse', description: 响应数据 } } }] }
    CompleteUploadResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CompleteUploadResponse', description: 响应数据 } } }] }
    CreateDownloadUrlResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CreateDownloadUrlResponse', description: 响应数据 } } }] }
    RegisterResultFileResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/RegisterResultFileResponse', description: 响应数据 } } }] }
    FileDetailResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/FileDetailResponse', description: 响应数据 } } }] }
    DeleteFileResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/DeleteFileResponse', description: 响应数据 } } }] }

    McpConnectorTreeRequest:
      type: object
      required: [connectorType, link]
      properties:
        connectorType: { type: string, enum: [CONFLUENCE, SHAREPOINT, S3_BLOB], description: 连接器类型 }
        connectorSource: { type: string, description: 连接器来源（SharePoint/OneDrive） }
        link: { type: string, description: 外部链接或资源路径 }
        sourceType: { type: string, description: 对象存储来源类型（S3/Blob） }
        accessMode: { type: string, description: 访问方式 }
        traverseSubDir: { type: boolean, default: true, description: 是否遍历子级目录 }
        credentialId: { type: string, description: Vault 出站凭据 ID }

    McpConnectorTreeResponse:
      type: object
      description: MCP 连接器目录树预览响应。
      properties:
        root: { type: object, additionalProperties: true, description: 根页面节点 }
        selectable: { type: array, items: { type: object, additionalProperties: true }, description: 可选择导入的项目 }
        truncated: { type: boolean, description: 是否因深度或节点上限截断 }
        stats: { type: object, properties: { nodes: { type: integer }, max_depth_reached: { type: integer } }, description: 统计信息 }
        traverse_children: { type: boolean, description: 是否遍历子节点 }

    McpImportRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds: { type: array, minItems: 1, maxItems: 200, items: { type: string }, description: 选中的项目 ID 列表 }
        credentialId: { type: string, description: Vault 出站凭据 ID }
        bizType: { type: string, default: KNOWLEDGE_SOURCE, description: 业务类型 }
        bizRefId: { type: string, description: 业务引用 ID，例如知识库 ID }

    McpImportResponse:
      type: object
      description: MCP 文件导入知识库响应。
      properties:
        results:
          type: array
          description: 导入结果列表
          items:
            type: object
            properties:
              item_id: { type: string, description: 项目 ID }
              kind: { type: string, description: 种类 }
              page_id: { type: string, description: 页面 ID }
              name: { type: string, description: 名称 }
              media_type: { type: string, description: 媒体类型 }
              size: { type: integer, format: int64, description: 文件大小（字节） }
              file_id: { type: string, description: 产生的 File ID }
              session_id: { type: string, description: 上传会话 ID }
              status: { type: string, description: 状态 }
              title: { type: string, description: 标题 }
              space_key: { type: string, description: 空间 key }
              error: { type: string, description: 错误 }
              message: { type: string, description: 消息 }
        manifest:
          type: object
          description: 导入汇总
          properties:
            exported_at: { type: string, description: 导出时间 }
            landing: { type: string, description: 目标服务 }
            source: { type: string, description: 来源 }
            credential_id: { type: string, description: 凭据 ID }
            biz_type: { type: string, description: 业务类型 }
            biz_ref_id: { type: string, description: 业务引用 ID }
            requested: { type: integer, description: 请求总数 }
            uploaded: { type: integer, description: 成功处理数 }
            failed: { type: integer, description: 失败数 }

    McpConnectorTreeEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/McpConnectorTreeResponse', description: 响应数据 } } }] }
    McpImportEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/McpImportResponse', description: 响应数据 } } }] }

    SaveKnowledgeDocumentChunkRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, description: 内容 }
        metadata: { type: object, additionalProperties: true, description: 扩展元数据 }

    PipelineStageConfig:
      type: object
      required: [type, options]
      properties:
        type: { type: string, description: 类型 }
        options: { type: object, additionalProperties: true, description: 配置选项 }

    ParserConfig:
      oneOf:
        - $ref: '#/components/schemas/DoclingParserConfig'
        - $ref: '#/components/schemas/AzureDocumentIntelligenceParserConfig'
        - $ref: '#/components/schemas/MinerUParserConfig'
        - $ref: '#/components/schemas/DeepDocParserConfig'
      discriminator:
        propertyName: type
        mapping:
          docling: '#/components/schemas/DoclingParserConfig'
          azureDocumentIntelligence: '#/components/schemas/AzureDocumentIntelligenceParserConfig'
          minerU: '#/components/schemas/MinerUParserConfig'
          deepDoc: '#/components/schemas/DeepDocParserConfig'

    ChunkingConfig:
      oneOf:
        - $ref: '#/components/schemas/SemanticChunkingConfig'
        - $ref: '#/components/schemas/FixedChunkingConfig'
        - $ref: '#/components/schemas/ParentChunkingConfig'
        - $ref: '#/components/schemas/HierarchicalChunkingConfig'
      discriminator:
        propertyName: type
        mapping:
          Semantic: '#/components/schemas/SemanticChunkingConfig'
          Fixed: '#/components/schemas/FixedChunkingConfig'
          Parent: '#/components/schemas/ParentChunkingConfig'
          Hierarchical: '#/components/schemas/HierarchicalChunkingConfig'

    EnhanceConfig:
      oneOf:
        - $ref: '#/components/schemas/FaqEnhanceConfig'
        - $ref: '#/components/schemas/SummaryEnhanceConfig'
        - $ref: '#/components/schemas/KeywordEnhanceConfig'
      discriminator:
        propertyName: type
        mapping:
          FAQ: '#/components/schemas/FaqEnhanceConfig'
          Summary: '#/components/schemas/SummaryEnhanceConfig'
          Keyword: '#/components/schemas/KeywordEnhanceConfig'

    EmbeddingConfig:
      oneOf:
        - $ref: '#/components/schemas/BgeM3EmbeddingConfig'
        - $ref: '#/components/schemas/TextEmbedding3LargeConfig'
        - $ref: '#/components/schemas/VoyageEmbeddingConfig'
        - $ref: '#/components/schemas/QwenEmbeddingConfig'
      discriminator:
        propertyName: type
        mapping:
          BGE-M3: '#/components/schemas/BgeM3EmbeddingConfig'
          text-embedding-3-large: '#/components/schemas/TextEmbedding3LargeConfig'
          Voyage: '#/components/schemas/VoyageEmbeddingConfig'
          Qwen: '#/components/schemas/QwenEmbeddingConfig'

    VectorStoreConfig:
      oneOf:
        - $ref: '#/components/schemas/MilvusVectorStoreConfig'
        - $ref: '#/components/schemas/QdrantVectorStoreConfig'
        - $ref: '#/components/schemas/PgVectorStoreConfig'
        - $ref: '#/components/schemas/AzureAiSearchVectorStoreConfig'
      discriminator:
        propertyName: type
        mapping:
          Milvus: '#/components/schemas/MilvusVectorStoreConfig'
          Qdrant: '#/components/schemas/QdrantVectorStoreConfig'
          PGVector: '#/components/schemas/PgVectorStoreConfig'
          Azure AI Search: '#/components/schemas/AzureAiSearchVectorStoreConfig'

    DoclingParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: docling, description: 类型 } } }] }
    AzureDocumentIntelligenceParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: azureDocumentIntelligence, description: 类型 } } }] }
    MinerUParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: minerU, description: 类型 } } }] }
    DeepDocParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: deepDoc, description: 类型 } } }] }
    SemanticChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Semantic, description: 类型 } } }] }
    FixedChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Fixed, description: 类型 } } }] }
    ParentChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Parent, description: 类型 } } }] }
    HierarchicalChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Hierarchical, description: 类型 } } }] }
    FaqEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: FAQ, description: 类型 } } }] }
    SummaryEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Summary, description: 类型 } } }] }
    KeywordEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Keyword, description: 类型 } } }] }
    BgeM3EmbeddingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: BGE-M3, description: 类型 } } }] }
    TextEmbedding3LargeConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: text-embedding-3-large, description: 类型 } } }] }
    VoyageEmbeddingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Voyage, description: 类型 } } }] }
    QwenEmbeddingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Qwen, description: 类型 } } }] }
    MilvusVectorStoreConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Milvus, description: 类型 } } }] }
    QdrantVectorStoreConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Qdrant, description: 类型 } } }] }
    PgVectorStoreConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: PGVector, description: 类型 } } }] }
    AzureAiSearchVectorStoreConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Azure AI Search, description: 类型 } } }] }

    KnowledgePipelineConfigRequest:
      type: object
      description: 完整知识库构建 pipeline 配置，对应 KnowledgePipelineConfigRequest。
      required: [parser, chunking, enhance, embedding, vectorStore]
      properties:
        parser: { $ref: '#/components/schemas/ParserConfig', description: 解析配置 }
        chunking: { $ref: '#/components/schemas/ChunkingConfig', description: 切片配置 }
        enhance:
          description: 增强配置
          type: array
          items: { $ref: '#/components/schemas/EnhanceConfig' }
        embedding: { $ref: '#/components/schemas/EmbeddingConfig', description: 向量化配置 }
        vectorStore: { $ref: '#/components/schemas/VectorStoreConfig', description: 向量库配置 }

    KnowledgeTagRequest:
      type: object
      required: [name]
      properties:
        tagId: { type: string, maxLength: 64, description: 标签 ID }
        name: { type: string, minLength: 1, maxLength: 64, description: 名称 }

    CreateKnowledgeTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 名称 }

    CreateKnowledgeBaseRequest:
      type: object
      required: [directoryId, name, visibility, pipelineConfig, roleApprovers]
      properties:
        directoryId: { type: integer, format: int64, minimum: 1, description: 目录 ID }
        name: { type: string, minLength: 1, maxLength: 255, description: 名称 }
        description: { type: string, maxLength: 512, description: 描述 }
        visibility: { type: string, enum: [PUBLIC, RESTRICTED, PRIVATE], minLength: 1, description: '可见性：PUBLIC, RESTRICTED, PRIVATE' }
        recommendedConfig: { type: boolean, default: true, description: 是否使用推荐配置 }
        roleApprovers: { $ref: '#/components/schemas/KnowledgeBaseRoleApprovers', description: 建库时记录的四类角色审批人 }
        tags:
          description: 标签列表
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/KnowledgeTagRequest' }
        pipelineConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 管线配置 }
        metadata: { type: object, maxProperties: 50, additionalProperties: true, description: 扩展元数据 }

    KnowledgeBaseRoleApprovers:
      type: object
      additionalProperties: false
      required: [owner, deputy, contributor, consumer]
      description: >-
        建库时记录的四类角色审批人。Alice 未接通期间仅校验每组至少一条非空人工输入，
        不代表角色已创建或生效。
      properties:
        owner: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        deputy: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        contributor: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        consumer: { type: array, minItems: 1, items: { type: string, minLength: 1 } }

    UpdateKnowledgeBaseConfigRequest:
      type: object
      description: 更新知识库 P0 管线配置；本接口不修改 embedding 和 vectorStore。
      additionalProperties: false
      properties:
        parser: { $ref: '#/components/schemas/PipelineStageConfig', description: 解析配置 }
        chunking: { $ref: '#/components/schemas/PipelineStageConfig', description: 切片配置 }
        enhance:
          description: 增强配置
          type: array
          items: { $ref: '#/components/schemas/PipelineStageConfig' }

    KnowledgeBasePipelineConfigSnapshot:
      type: object
      description: 知识库管线配置快照。当前 knowledge-engine 实现按内部小写 type 返回，且 enhance 可能返回对象或列表。
      additionalProperties: true
      properties:
        parser: { $ref: '#/components/schemas/PipelineStageConfig', description: 解析配置 }
        chunking: { $ref: '#/components/schemas/PipelineStageConfig', description: 切片配置 }
        enhance:
          description: 增强配置
          oneOf:
            - $ref: '#/components/schemas/PipelineStageConfig'
            - type: array
              items: { $ref: '#/components/schemas/PipelineStageConfig' }

    UpdateKnowledgeDocumentStageConfigRequest:
      type: object
      required: [stageConfig]
      properties:
        stageConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 阶段配置 }

    KnowledgeBuildSourceRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, minLength: 1, description: 类型 }
        fileId: { type: string, description: 文件 ID }
        fileType: { type: string, description: 字段：fileType }
        url: { type: string, format: uri, description: 访问 URL }
        pageId: { type: string, description: 字段：pageId }
        repoUrl: { type: string, format: uri, description: 字段：repoUrl }
        stageConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 阶段配置 }
        metadata: { type: object, additionalProperties: true, description: 扩展元数据 }

    CreateKnowledgeBuildJobRequest:
      type: object
      required: [sources]
      properties:
        stageConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 阶段配置 }
        sources:
          description: 构建来源列表
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/KnowledgeBuildSourceRequest' }

    CreateKnowledgeBatchBuildJobRequest:
      type: object
      required: [sources]
      properties:
        stageConfig:
          type: object
          additionalProperties: true
          description: 批量构建阶段配置，可只覆盖需要调整的阶段
        sources:
          description: 待构建文档列表
          type: array
          minItems: 1
          items:
            type: object
            required: [documentId]
            properties:
              documentId: { type: string, description: 已有文档 ID }

    CreateDirectoryRequest:
      type: object
      required: [name]
      properties:
        parentId: { type: integer, format: int64, description: 父级 ID }
        name: { type: string, minLength: 1, description: 名称 }
        approverIds:
          description: 字段：approverIds
          type: array
          items: { type: string }

    RenameDirectoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: 名称 }

    UpdateDirectoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, description: 名称 }
        sortNo: { type: integer, description: 字段：sortNo }

    DirectoryDetail:
      type: object
      properties:
        id: { type: integer, format: int64, description: ID }
        parentId: { type: integer, format: int64, description: 父级 ID }
        name: { type: string, description: 名称 }
        path: { type: string, description: 字段：path }
        sortNo: { type: integer, description: 字段：sortNo }
        directoryType: { type: string, enum: [PUBLIC, PERSONAL], description: 字段：directoryType }
        createdAt: { type: string, format: date-time, description: 创建时间 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }

    DeleteDirectoryResponse:
      type: object
      required: [directoryId, deleted]
      properties:
        directoryId: { type: integer, format: int64, description: 目录 ID }
        deleted: { type: boolean, description: 是否已删除 }

    KnowledgeTagResponse:
      type: object
      properties:
        tagId: { type: string, description: 标签 ID }
        name: { type: string, description: 名称 }

    KnowledgeBaseCreateResponse:
      type: object
      properties:
        knowledgeBaseId: { type: string, description: 知识库 ID }
        directoryId: { type: integer, format: int64, description: 所属目录 ID }
        name: { type: string, description: 名称 }
        description: { type: string, description: 描述 }
        visibility: { type: string, description: 可见性 }
        status: { type: string, description: 状态 }
        recommendedConfig: { type: boolean, description: 是否使用推荐配置 }
        tags:
          description: 标签列表
          type: array
          items: { $ref: '#/components/schemas/KnowledgeTagResponse' }
        pipelineConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 管线配置 }
        createdAt: { type: string, format: date-time, description: 创建时间 }

    KnowledgeBaseListItemResponse:
      type: object
      properties:
        knowledgeBaseId: { type: string, description: 知识库 ID }
        directoryId: { type: integer, format: int64, description: 所属目录 ID }
        directoryInfo:
          type: object
          description: 当前知识库所在目录信息
          properties:
            name: { type: string, description: 目录名称 }
        name: { type: string, description: 名称 }
        description: { type: string, description: 描述 }
        visibility: { type: string, description: 可见性 }
        status: { type: string, description: 状态 }
        recommendedConfig: { type: boolean, description: 是否使用推荐配置 }
        tags: { type: array, items: { $ref: '#/components/schemas/KnowledgeTagResponse' }, description: 标签列表 }
        documentCount: { type: integer, description: 文档总数 }
        liveDocumentCount: { type: integer, description: 已生效文档数 }
        buildingDocumentCount: { type: integer, description: 构建中文档数 }
        retrievalReady: { type: boolean, description: 是否可检索 }
        pipelineConfig: { $ref: '#/components/schemas/KnowledgePipelineConfigRequest', description: 管线配置 }
        vectorCollection: { type: string, description: 向量集合名 }
        vectorDimension: { type: integer, description: 向量维度 }
        lastBuildAt: { type: string, format: date-time, description: 最近构建时间 }
        createdAt: { type: string, format: date-time, description: 创建时间 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }

    KnowledgeBasePageResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KnowledgeBaseListItemResponse' }, description: 列表项 }
        page: { type: integer, minimum: 1, description: 当前页码 }
        pageSize: { type: integer, minimum: 1, description: 每页数量 }
        total: { type: integer, format: int64, minimum: 0, description: 总数 }

    KnowledgeBaseStatsResponse:
      type: object
      properties:
        documentCount: { type: integer, description: 文档总数 }
        chunkCount: { type: integer, description: 切片数 }
        vectorCount: { type: integer, description: 向量数 }
        readiness: { type: string, description: 就绪状态 }
        liveDocumentCount: { type: integer, description: 已生效文档数 }
        buildingDocumentCount: { type: integer, description: 构建中文档数 }
        retrievalReady: { type: boolean, description: 是否可检索 }

    KnowledgeBaseDetailResponse:
      allOf:
        - $ref: '#/components/schemas/KnowledgeBaseCreateResponse'
        - type: object
          properties:
            stats: { $ref: '#/components/schemas/KnowledgeBaseStatsResponse', description: 统计信息 }
            contentSummary: { type: array, items: { type: string }, description: 字段：contentSummary }
            build: { type: object, additionalProperties: true, description: 字段：build }
            capabilities: { type: array, items: { type: object, additionalProperties: true }, description: 字段：capabilities }
            updatedAt: { type: string, format: date-time, description: 更新时间 }

    KnowledgeBaseConfigUpdateResponse:
      type: object
      properties:
        knowledgeBaseId: { type: string, description: 知识库 ID }
        pipelineConfig: { $ref: '#/components/schemas/KnowledgeBasePipelineConfigSnapshot', description: 管线配置 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }

    KnowledgeBaseStatisticsResponse:
      type: object
      properties:
        knowledgeBaseId: { type: string, description: 知识库 ID }
        documentCount: { type: integer, description: 文档总数 }
        chunkCount: { type: integer, description: 切片数 }
