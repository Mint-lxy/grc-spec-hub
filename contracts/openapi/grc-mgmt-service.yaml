openapi: 3.1.0
info:
  title: GRC Management Service API
  version: "1.0"
  description: >-
    grc-mgt-service 的对外契约。**本文件当前只落地 chat 会话子域**
    （对应 specs/001-conversation/plan.md，api-landscape.md §3.7）：会话 CRUD、
    知识库挂载管理，以及两个供 grc-agent-service 调用的内部接口。该服务的其余模块
    （marketplace 资产/订阅审批、RBAC、凭据库、文件服务等，见 api-landscape.md §3.1~3.6）
    由对应 feature spec（002~008）后续以非破坏性方式追加到本文件，不在本次范围内。
servers:
  - url: https://api.internal/api/v1
    description: 经 grc-api-gateway 转发后的路径（网关统一加 /api/v1 前缀，内部路由本身以 /mgt 为前缀）
tags:
  - name: ChatSession
  - name: ChatSessionInternal
paths:
  /mgt/chat/sessions:
    post:
      tags: [ChatSession]
      operationId: createChatSession
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type: [string, "null"]
                  description: 资产透传会话的资产 ID；平台 Chat 会话为空
                modelId:
                  type: [string, "null"]
                title:
                  type: [string, "null"]
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'

    get:
      tags: [ChatSession]
      operationId: listChatSessions
      summary: 会话列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          required: false
          description: 匹配会话标题
          schema: { type: string }
        - name: assetId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'

  /mgt/chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [ChatSession]
      operationId: getChatSessionDetail
      summary: 会话详情（含历史消息）
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetailEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    patch:
      tags: [ChatSession]
      operationId: renameChatSession
      summary: 重命名会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 更新后的会话摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    delete:
      tags: [ChatSession]
      operationId: deleteChatSession
      summary: 删除会话（软删除，消息记录保留审计留痕）
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgt/chat/sessions/{sessionId}/knowledge-mounts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [ChatSession]
      operationId: setKnowledgeMounts
      summary: 挂载/卸载知识库
      description: >-
        挂载前对每个 knowledgeBaseId 做 RBAC 权限校验（复用 `/mgt/internal/check`，
        `CATALOG` 类型）；无权限的 ID 静默剔除，返回实际生效的 mounts[]，不整体报错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBaseIds]
              properties:
                knowledgeBaseIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 实际生效的挂载结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    get:
      tags: [ChatSession]
      operationId: getKnowledgeMounts
      summary: 已挂载知识库列表
      responses:
        '200':
          description: 已挂载知识库列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgt/internal/chat/sessions/{sessionId}/context:
    get:
      tags: [ChatSessionInternal]
      operationId: getChatSessionContextInternal
      summary: '[内部] 查询会话上下文（供 grc-agent-service 调用）'
      description: >-
        grc-agent-service 在处理 `POST /chat/sessions/{sessionId}/messages`
        （见 grc-agent-service.yaml）时同步调用本接口，取挂载的知识库 ID 与历史消息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: includeHistory
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 会话上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionContextEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgt/internal/chat/sessions/{sessionId}/messages:
    post:
      tags: [ChatSessionInternal]
      operationId: appendChatMessageInternal
      summary: '[内部] 追加一条已生成的消息（供 grc-agent-service 在生成完成后回写）'
      description: >-
        待评审确认：生成中途失败/被中止时是否仍调用本接口回写部分内容
        （见 specs/001-conversation/plan.md 待评审确认项）。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '200':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendMessageResponseEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }

  responses:
    SessionNotFound:
      description: sessionId 不存在、已删除，或不属于该请求用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: "0=成功" }
        message: { type: string }
        requestId: { type: string }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
        requestId: { type: string }

    ChatSessionSummary:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        assetId: { type: [string, "null"] }
        assetName: { type: [string, "null"] }
        title: { type: string }
        modelId: { type: [string, "null"] }
        lastMessageAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ChatSessionSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionSummary' }

    ChatSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ChatSessionSummary' }
                total: { type: integer }

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              knowledgeBaseId: { type: string }
              docId: { type: string }
              chunkId: { type: [string, "null"] }
              content: { type: string }
              score: { type: number, format: float }
        toolCalls:
          type: array
          items:
            type: object
            properties:
              toolName: { type: string }
              arguments: { type: object, additionalProperties: true }
              resultSummary: { type: string }
        thinkingProcess:
          type: [string, "null"]
          description: 深度分析模式下的思考过程（可折叠有序步骤，格式待细化）
        createdAt: { type: string, format: date-time }

    ChatSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            knowledgeMounts:
              type: array
              items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionDetail' }

    KnowledgeMount:
      type: object
      required: [knowledgeBaseId, name]
      properties:
        knowledgeBaseId: { type: string }
        name: { type: string }
        directoryPath: { type: [string, "null"] }
        snapshotAt: { type: [string, "null"], format: date-time }

    KnowledgeMountsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [mounts]
              properties:
                mounts:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionContext:
      type: object
      required: [sessionId, knowledgeBaseIds]
      properties:
        sessionId: { type: string }
        knowledgeBaseIds:
          type: array
          items: { type: string }
          description: 已通过权限校验、当前生效的挂载知识库 ID 列表
        modelId: { type: [string, "null"] }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              citations:
                type: array
                items: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }

    ChatSessionContextEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionContext' }

    AppendMessageRequest:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { type: object, additionalProperties: true }
        toolCalls:
          type: array
          items: { type: object, additionalProperties: true }
        thinkingProcess: { type: [string, "null"] }

    AppendMessageResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [messageId, createdAt]
              properties:
                messageId: { type: string }
                createdAt: { type: string, format: date-time }
