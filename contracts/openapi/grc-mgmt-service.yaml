  /mgmt/vault/outbound/credentials:
    post: { tags: [Outbound Credential Management], operationId: createOutboundCredential, summary: 创建出站凭据, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOutboundCredentialRequest' } } } }, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/OutboundCredentialEnvelope' } } } } } }
    get: { tags: [Outbound Credential Management], operationId: listOutboundCredentials, summary: 查询出站凭据列表, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/OutboundCredentialPageEnvelope' } } } } } }
  /mgmt/vault/outbound/credentials/{id}:
    parameters: [{ $ref: '#/components/parameters/CredentialId' }]
    get: { tags: [Outbound Credential Management], operationId: getOutboundCredential, summary: 查询出站凭据详情, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/OutboundCredentialEnvelope' } } } } } }
    put: { tags: [Outbound Credential Management], operationId: updateOutboundCredential, summary: 更新出站凭据, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOutboundCredentialRequest' } } } }, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/OutboundCredentialEnvelope' } } } } } }
    delete: { tags: [Outbound Credential Management], operationId: deleteOutboundCredential, summary: 删除出站凭据, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/VoidEnvelope' } } } } } }
  /mgmt/vault/outbound/credentials/{id}/status:
    parameters: [{ $ref: '#/components/parameters/CredentialId' }]
    put: { tags: [Outbound Credential Management], operationId: updateOutboundCredentialStatus, summary: 更新出站凭据状态, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOutboundCredentialStatusRequest' } } } }, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/VoidEnvelope' } } } } } }
  /mgmt/vault/outbound/credentials/{id}/resolve:
    parameters: [{ $ref: '#/components/parameters/CredentialId' }]
    get: { tags: [Internal Vault API], operationId: resolveOutboundCredential, summary: '[内部] 解析出站凭据', responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }
  /mgmt/vault/outbound/credentials/presets:
    get: { tags: [Outbound Credential Management], operationId: listCredentialPresets, summary: 获取认证参数预设列表, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }
  /mgmt/vault/outbound/credentials/presets/{targetType}/{targetId}:
    parameters: [{ $ref: '#/components/parameters/TargetType' }, { $ref: '#/components/parameters/TargetId' }]
    get: { tags: [Outbound Credential Management], operationId: getCredentialPreset, summary: 获取目标资源认证参数预设, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }
  /mgmt/vault/outbound/credentials/stats:
    get: { tags: [Outbound Credential Management], operationId: getOutboundCredentialStats, summary: 获取出站凭据统计, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }
  /mgmt/vault/audit:
    get: { tags: [Vault Audit], operationId: queryVaultAudit, summary: 查询凭据审计日志, responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/GenericResponse' } } } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
    DirectoryId: { name: directoryId, in: path, required: true, schema: { type: integer, format: int64 } }
    KnowledgeBaseId: { name: kbId, in: path, required: true, schema: { type: string } }
    DocumentId: { name: docId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
    StageType: { name: stageType, in: path, required: true, schema: { type: string } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string } }
    FlowId: { name: flowId, in: path, required: true, schema: { type: string } }
    StepId: { name: stepId, in: path, required: true, schema: { type: string } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, schema: { type: string } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    PermissionId: { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }
    CredentialId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    TargetType: { name: targetType, in: path, required: true, schema: { type: string } }
    TargetId: { name: targetId, in: path, required: true, schema: { type: string } }

  responses:
    SessionNotFound:
      description: sessionId 不存在、已删除，或不属于该请求用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string, const: '0', description: '0=成功；失败时使用已注册的服务前缀错误码' }
        message: { type: string, const: success }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    GenericRequest:
      type: object
      additionalProperties: true

    GenericResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data: {}

    CreateUploadSessionRequest:
      type: object
      required: [bizType, fileName, contentType, size]
      properties:
        bizType: { type: string, minLength: 1 }
        bizRefId: { type: string }
        fileName: { type: string, minLength: 1 }
        contentType: { type: string, minLength: 1 }
        size: { type: integer, format: int64, minimum: 1 }

    BatchCreateUploadSessionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateUploadSessionRequest' }

    UploadAuthResponse:
      type: object
      properties:
        method: { type: string }
        url: { type: string, format: uri }
        headers: { type: object, additionalProperties: { type: string } }
        formFields: { type: object, additionalProperties: { type: string } }
        expireAt: { type: string, format: date-time }

    CreateUploadSessionResponse:
      type: object
      properties:
        fileId: { type: string }
        sessionId: { type: string }
        storageProvider: { type: string }
        uploadAuth: { $ref: '#/components/schemas/UploadAuthResponse' }

    BatchCreateUploadSessionResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CreateUploadSessionResponse' }

    CompleteUploadRequest:
      type: object
      required: [etag, size]
      properties:
        etag: { type: string, minLength: 1 }
        size: { type: integer, format: int64, minimum: 1 }

    CompleteUploadResponse:
      type: object
      properties:
        fileId: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }

    CreateDownloadUrlRequest:
      type: object
      properties:
        expireSeconds: { type: integer, minimum: 1 }

    CreateDownloadUrlResponse:
      type: object
      properties:
        fileId: { type: string }
        downloadUrl: { type: string, format: uri }
        expireAt: { type: string, format: date-time }

    RegisterResultFileRequest:
      type: object
      required: [sourceFileId, bizType, fileName, contentType, size]
      properties:
        sourceFileId: { type: string }
        bizType: { type: string }
        bizRefId: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, minimum: 1 }

    RegisterResultFileResponse:
      type: object
      properties:
        fileId: { type: string }
        sourceFileId: { type: string }
        status: { type: string }

    FileDetailResponse:
      type: object
      properties:
        fileId: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string }
        bizType: { type: string }
        bizRefId: { type: string }
        storageProvider: { type: string }
        createdAt: { type: string, format: date-time }

    DeleteFileResponse:
      type: object
      properties:
        fileId: { type: string }
        deleted: { type: boolean }

    CreateUploadSessionResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CreateUploadSessionResponse' } } }] }
    BatchCreateUploadSessionResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/BatchCreateUploadSessionResponse' } } }] }
    CompleteUploadResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CompleteUploadResponse' } } }] }
    CreateDownloadUrlResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/CreateDownloadUrlResponse' } } }] }
    RegisterResultFileResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/RegisterResultFileResponse' } } }] }
    FileDetailResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/FileDetailResponse' } } }] }
    DeleteFileResponseEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/DeleteFileResponse' } } }] }

    SaveKnowledgeDocumentChunkRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        metadata: { type: object, additionalProperties: true }

    PipelineStageConfig:
      type: object
      required: [type, options]
      properties:
        type: { type: string }
        options: { type: object, additionalProperties: true }

    ParserConfig:
      oneOf:
        - $ref: '#/components/schemas/DoclingParserConfig'
        - $ref: '#/components/schemas/AzureDocumentIntelligenceParserConfig'
        - $ref: '#/components/schemas/MinerUParserConfig'
        - $ref: '#/components/schemas/DeepDocParserConfig'
      discriminator:
        propertyName: type
        mapping:
          docling: '#/components/schemas/DoclingParserConfig'
          azureDocumentIntelligence: '#/components/schemas/AzureDocumentIntelligenceParserConfig'
          minerU: '#/components/schemas/MinerUParserConfig'
          deepDoc: '#/components/schemas/DeepDocParserConfig'

    ChunkingConfig:
      oneOf:
        - $ref: '#/components/schemas/SemanticChunkingConfig'
        - $ref: '#/components/schemas/FixedChunkingConfig'
        - $ref: '#/components/schemas/ParentChunkingConfig'
        - $ref: '#/components/schemas/HierarchicalChunkingConfig'
      discriminator:
        propertyName: type
        mapping:
          Semantic: '#/components/schemas/SemanticChunkingConfig'
          Fixed: '#/components/schemas/FixedChunkingConfig'
          Parent: '#/components/schemas/ParentChunkingConfig'
          Hierarchical: '#/components/schemas/HierarchicalChunkingConfig'

    EnhanceConfig:
      oneOf:
        - $ref: '#/components/schemas/FaqEnhanceConfig'
        - $ref: '#/components/schemas/SummaryEnhanceConfig'
        - $ref: '#/components/schemas/KeywordEnhanceConfig'
      discriminator:
        propertyName: type
        mapping:
          FAQ: '#/components/schemas/FaqEnhanceConfig'
          Summary: '#/components/schemas/SummaryEnhanceConfig'
          Keyword: '#/components/schemas/KeywordEnhanceConfig'

    EmbeddingConfig:
      oneOf:
        - $ref: '#/components/schemas/BgeM3EmbeddingConfig'
        - $ref: '#/components/schemas/TextEmbedding3LargeConfig'
        - $ref: '#/components/schemas/VoyageEmbeddingConfig'
        - $ref: '#/components/schemas/QwenEmbeddingConfig'
      discriminator:
        propertyName: type
        mapping:
          BGE-M3: '#/components/schemas/BgeM3EmbeddingConfig'
          text-embedding-3-large: '#/components/schemas/TextEmbedding3LargeConfig'
          Voyage: '#/components/schemas/VoyageEmbeddingConfig'
          Qwen: '#/components/schemas/QwenEmbeddingConfig'

    VectorStoreConfig:
      oneOf:
        - $ref: '#/components/schemas/MilvusVectorStoreConfig'
        - $ref: '#/components/schemas/QdrantVectorStoreConfig'
        - $ref: '#/components/schemas/PgVectorStoreConfig'
        - $ref: '#/components/schemas/AzureAiSearchVectorStoreConfig'
      discriminator:
        propertyName: type
        mapping:
          Milvus: '#/components/schemas/MilvusVectorStoreConfig'
          Qdrant: '#/components/schemas/QdrantVectorStoreConfig'
          PGVector: '#/components/schemas/PgVectorStoreConfig'
          Azure AI Search: '#/components/schemas/AzureAiSearchVectorStoreConfig'

    DoclingParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: docling } } }] }
    AzureDocumentIntelligenceParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: azureDocumentIntelligence } } }] }
    MinerUParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: minerU } } }] }
    DeepDocParserConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: deepDoc } } }] }
    SemanticChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Semantic } } }] }
    FixedChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Fixed } } }] }
    ParentChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Parent } } }] }
    HierarchicalChunkingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Hierarchical } } }] }
    FaqEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: FAQ } } }] }
    SummaryEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Summary } } }] }
    KeywordEnhanceConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Keyword } } }] }
    BgeM3EmbeddingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: BGE-M3 } } }] }
    TextEmbedding3LargeConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: text-embedding-3-large } } }] }
    VoyageEmbeddingConfig: { allOf: [{ $ref: '#/components/schemas/PipelineStageConfig' }, { type: object, properties: { type: { const: Voyage } } }] }
