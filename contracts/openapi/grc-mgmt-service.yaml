openapi: 3.1.0
info:
  title: GRC Management Service API
  version: "2.0"
  description: >-
    grc-mgt-service 的对外契约，覆盖 chat、文件、知识库、marketplace、RBAC 与 vault 管理接口。
    其中 chat 会话子域
    （对应 specs/001-conversation/plan.md，api-landscape.md §3.7）：会话 CRUD、
    知识库挂载管理，以及两个供 grc-agent-service 调用的内部接口；② 凭据库的模型调用解析
    接口（对应 specs/007-credential/plan.md，ADR-003/ADR-005，api-landscape.md §3.5）：
    `POST /mgmt/vault/inbound/resolve-model` 与 `POST /mgmt/vault/inbound/
    report-credential-failure`（spec 007 AC-13 降级机制），均供 grc-python-sdk 调用。
    其余接口按照对应 feature spec（002~006、008）持续补充，具体字段契约以各 feature
    contract 和实现同步更新为准。
servers:
  - url: https://api.internal/api/v1
    description: 经 grc-api-gateway 转发后的路径（网关统一加 /api/v1 前缀，内部路由本身以 /mgmt 为前缀）
security:
  - bearerAuth: []
tags:
  - name: ChatSession
  - name: ChatSessionInternal
  - name: VaultInternal
  - name: File Management
  - name: Internal File
  - name: Knowledge Directory
  - name: Knowledge Base
  - name: Knowledge Platform Resource
  - name: Knowledge Document & Job
  - name: Knowledge Retrieval
  - name: Knowledge Permission
  - name: Marketplace Asset
  - name: Marketplace Approval
  - name: Marketplace Creator Center
  - name: Marketplace Subscription
  - name: Marketplace Tags
  - name: User Management
  - name: Role Management
  - name: Permission Management
  - name: Permission Check
  - name: Effective Permission
  - name: Internal Permission Check
  - name: Role-Permission Binding
  - name: User-Role Binding
  - name: Inbound PAT Management
  - name: Outbound Credential Management
  - name: Internal Vault API
  - name: Vault Audit
paths:
  /mgmt/chat/sessions:
    post:
      tags: [ChatSession]
      operationId: createChatSession
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type: [string, "null"]
                  description: 资产透传会话的资产 ID；平台 Chat 会话为空
                modelId:
                  type: [string, "null"]
                title:
                  type: [string, "null"]
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'

    get:
      tags: [ChatSession]
      operationId: listChatSessions
      summary: 会话列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          required: false
          description: 匹配会话标题
          schema: { type: string }
        - name: assetId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'

  /mgmt/chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [ChatSession]
      operationId: getChatSessionDetail
      summary: 会话详情（含历史消息）
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetailEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    patch:
      tags: [ChatSession]
      operationId: renameChatSession
      summary: 重命名会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 更新后的会话摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    delete:
      tags: [ChatSession]
      operationId: deleteChatSession
      summary: 删除会话（软删除，消息记录保留审计留痕）
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/chat/sessions/{sessionId}/knowledge-mounts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [ChatSession]
      operationId: setKnowledgeMounts
      summary: 挂载/卸载知识库
      description: >-
        挂载前对每个 knowledgeBaseId 做 RBAC 权限校验（复用 `/mgmt/internal/check`，
        `CATALOG` 类型）；无权限的 ID 静默剔除，返回实际生效的 mounts[]，不整体报错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBaseIds]
              properties:
                knowledgeBaseIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 实际生效的挂载结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    get:
      tags: [ChatSession]
      operationId: getKnowledgeMounts
      summary: 已挂载知识库列表
      responses:
        '200':
          description: 已挂载知识库列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/internal/chat/sessions/{sessionId}/context:
    get:
      tags: [ChatSessionInternal]
      operationId: getChatSessionContextInternal
      summary: '[内部] 查询会话上下文（供 grc-agent-service 调用）'
      description: >-
        grc-agent-service 在处理 `POST /chat/sessions/{sessionId}/messages`
        （见 grc-agent-service.yaml）时同步调用本接口，取挂载的知识库 ID 与历史消息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: includeHistory
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 会话上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionContextEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/internal/chat/sessions/{sessionId}/messages:
    post:
      tags: [ChatSessionInternal]
      operationId: appendChatMessageInternal
      summary: '[内部] 追加一条已生成的消息（供 grc-agent-service 在生成完成后回写）'
      description: >-
        待评审确认：生成中途失败/被中止时是否仍调用本接口回写部分内容
        （见 specs/001-conversation/plan.md 待评审确认项）。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '200':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendMessageResponseEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/vault/inbound/resolve-model:
    post:
      tags: [VaultInternal]
      operationId: resolveModelCredentialInternal
      summary: '[内部] 模型凭据解析（供 grc-python-sdk 调用）'
      description: >-
        对应 ADR-003（AI SDK）与 ADR-005（凭据解析归属）：按触发人解析，个人 Nexus PAT
        优先（取第一条已启用且快照标记可用的），无候选则用平台默认凭据兜底（spec 007
        AC-12/AC-21）。本接口只做凭据解析，不做模型调用本身——调用方（grc-python-sdk）
        拿到 credential 后自己去调对应 provider 的 API。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveModelResponseEnvelope'

  /mgmt/vault/inbound/report-credential-failure:
    post:
      tags: [VaultInternal]
      operationId: reportModelCredentialFailureInternal
      summary: '[内部] 上报一次模型凭据调用失败（供 grc-python-sdk 调用），驱动 spec 007 AC-13 降级'
      description: >-
        AC-13 原文："鉴权/权限类失败时本次改用平台默认凭据、快照置不可用、通知本人；
        瞬时故障不改写快照。"——网络错误/超时/5xx 等瞬时故障已由 grc-python-sdk 自己的
        重试机制处理（见 SDK `retry.py`），不应调用本接口；只有 `reason=auth_failed`
        （模型调用返回 401/403）时才上报。本接口把该用户当前使用的个人 Nexus PAT 标记
        为"快照不可用"（下一次 `resolve-model` 自动改用平台默认凭据兜底）并通知本人，
        不返回新的凭据——调用方上报后需要**重新调用** `resolve-model` 才能拿到平台
        默认凭据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reason]
              properties:
                userId: { type: string }
                reason:
                  type: string
                  enum: [auth_failed]
                  description: 目前只定义了一种上报原因；瞬时故障不应上报到本接口
      responses:
        '200':
          description: 已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /mgmt/file/files/upload-sessions:
    post:
      tags: [File Management]
      operationId: createUploadSession
      summary: 创建上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadSessionRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadSessionResponseEnvelope' } } } } }
  /mgmt/file/files/upload-sessions/batch:
    post:
      tags: [File Management]
      operationId: createUploadSessions
      summary: 批量创建上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreateUploadSessionRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreateUploadSessionResponseEnvelope' } } } } }
  /mgmt/file/files/upload-sessions/{sessionId}/complete:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [File Management]
      operationId: completeUploadSession
      summary: 完成上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteUploadRequest' } } }
      responses: { '200': { description: 完成成功, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteUploadResponseEnvelope' } } } } }
  /mgmt/file/files/{fileId}:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    get:
      tags: [File Management]
      operationId: getFileDetail
      summary: 查询文件详情
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/FileDetailResponseEnvelope' } } } } }
    delete:
      tags: [File Management]
      operationId: deleteFile
      summary: 删除文件
      responses: { '200': { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteFileResponseEnvelope' } } } } }
  /mgmt/file/files/{fileId}/download-url:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    post:
      tags: [File Management]
      operationId: createDownloadUrl
      summary: 创建文件下载地址
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlResponseEnvelope' } } } } }
  /mgmt/file/files/results:
    post:
      tags: [File Management]
      operationId: registerResultFile
      summary: 登记结果文件
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileRequest' } } }
      responses: { '200': { description: 登记成功, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileResponseEnvelope' } } } } }
  /mgmt/file/internal/files/{fileId}/download-url:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    post:
      tags: [Internal File]
      operationId: createInternalDownloadUrl
      summary: '[内部] 创建文件下载地址'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlResponseEnvelope' } } } } }
  /mgmt/file/internal/files/results:
    post:
      tags: [Internal File]
      operationId: registerInternalResultFile
      summary: '[内部] 登记结果文件'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileRequest' } } }
      responses: { '200': { description: 登记成功, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileResponseEnvelope' } } } } }

  /mgmt/knowledge/directories/tree:
    get:
      tags: [Knowledge Directory]
      operationId: getDirectoryTree
      summary: 查询知识目录树
      parameters:
        - { name: includeKbCount, in: query, schema: { type: boolean, default: false } }
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: directoryType, in: query, required: false, schema: { type: string, enum: [PUBLIC, PERSONAL] } }
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryTreeResponse' } } } } }
  /mgmt/knowledge/directories:
    post:
      tags: [Knowledge Directory]
      operationId: createDirectory
      summary: 创建知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDirectoryRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
  /mgmt/knowledge/directories/{directoryId}/rename:
    parameters: [{ $ref: '#/components/parameters/DirectoryId' }]
    patch:
      tags: [Knowledge Directory]
      operationId: renameDirectory
      summary: 重命名知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameDirectoryRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
  /mgmt/knowledge/directories/{directoryId}:
    parameters: [{ $ref: '#/components/parameters/DirectoryId' }]
    patch:
      tags: [Knowledge Directory]
      operationId: updateDirectory
      summary: 更新知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDirectoryRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
    delete:
      tags: [Knowledge Directory]
      operationId: deleteDirectory
      summary: 删除知识目录
      responses: { '200': { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteDirectoryEnvelope' } } } } }

  /mgmt/knowledge/tags:
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeTag
      summary: 创建知识库标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeTagRequest' }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeTagEnvelope' } } } } }
    get:
      tags: [Knowledge Base]
      operationId: listKnowledgeTags
      summary: 查询知识库标签
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeTagListEnvelope' } } } } }

  /mgmt/knowledge/knowledge-bases:
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeBase
      summary: 创建知识库
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKnowledgeBaseRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseCreateEnvelope' } } } } }
    get:
      tags: [Knowledge Base]
      operationId: listKnowledgeBases
      summary: 查询知识库列表
      parameters:
        - { name: directoryId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: retrievalReady, in: query, required: false, schema: { type: boolean } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBasePageEnvelope' } } } } }
  /mgmt/knowledge/platform-resources/vector-store-instances:
    get:
      tags: [Knowledge Platform Resource]
      operationId: listVectorStoreInstances
      summary: 查询可用向量库实例
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [Milvus, PGVector] }
          description: 按向量库类型筛选。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GenericResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/VectorStoreInstance' }
  /mgmt/knowledge/knowledge-bases/{kbId}:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    get:
      tags: [Knowledge Base]
      operationId: getKnowledgeBaseDetail
      summary: 查询知识库详情
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseDetailEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/config:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    patch:
      tags: [Knowledge Base]
      operationId: updateKnowledgeBaseConfig
      summary: 更新知识库配置
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseConfigRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseConfigUpdateEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/documents:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeDocument
      summary: 创建知识库文档
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKnowledgeDocumentRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDocumentCreateEnvelope' } } } } }
    get:
      tags: [Knowledge Base]
      operationId: listKnowledgeBaseDocuments
      summary: 查询知识库文档列表
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseDocumentPageEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/build-jobs:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeBuildJob
      summary: 创建知识库构建任务
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKnowledgeBuildJobRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBuildJobEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/stats:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    get:
      tags: [Knowledge Base]
      operationId: getKnowledgeBaseStatistics
      summary: 查询知识库统计
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseStatisticsEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/publish:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [Knowledge Base]
      operationId: publishKnowledgeBase
      summary: 发布知识库
      responses: { '200': { description: 发布成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseDetailEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/offline:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [Knowledge Base]
      operationId: offlineKnowledgeBase
      summary: 下线知识库
      responses: { '200': { description: 下线成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseDetailEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/documents/{docId}/stage-config:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }, { $ref: '#/components/parameters/DocumentId' }]
    patch:
      tags: [Knowledge Base]
      operationId: updateDocumentStageConfig
      summary: 更新文档阶段配置
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateKnowledgeDocumentStageConfigRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDocumentStageConfigUpdateEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/documents/{docId}/parse:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }, { $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Knowledge Base]
      operationId: getDocumentParse
      summary: 查询文档解析结果
