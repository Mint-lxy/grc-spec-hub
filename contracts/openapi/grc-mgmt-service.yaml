        - { name: endTime, in: query, required: false, description: 查询结束时间, schema: { type: string } }
        - { name: page, in: query, required: false, description: 页码, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, description: 每页条数, schema: { type: integer, minimum: 1, default: 20 } }
