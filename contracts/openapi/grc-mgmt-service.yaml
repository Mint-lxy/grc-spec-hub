        role: { type: string, enum: [user, assistant], description: 字段：role }
        content: { type: string, description: 内容 }
        citations:
          description: 字段：citations
          type: array
          items:
            type: object
            properties:
              knowledgeBaseId: { type: string, description: 知识库 ID }
              docId: { type: string, description: 文档 ID }
              chunkId: { type: [string, "null"], description: 切片 ID }
              content: { type: string, description: 内容 }
              score: { type: number, format: float, description: 字段：score }
        toolCalls:
          description: 字段：toolCalls
          type: array
          items:
            type: object
            properties:
              toolName: { type: string, description: 字段：toolName }
              arguments: { type: object, additionalProperties: true, description: 字段：arguments }
              resultSummary: { type: string, description: 字段：resultSummary }
        thinkingProcess:
          type: [string, "null"]
          description: 深度分析模式下的思考过程（可折叠有序步骤，格式待细化）
        createdAt: { type: string, format: date-time, description: 创建时间 }

    ChatSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          properties:
            messages:
              description: 字段：messages
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            knowledgeMounts:
              description: 字段：knowledgeMounts
              type: array
              items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionDetail', description: 响应数据 }

    KnowledgeMount:
      type: object
      required: [knowledgeBaseId, name]
      properties:
        knowledgeBaseId: { type: string, description: 知识库 ID }
        name: { type: string, description: 名称 }
        directoryPath: { type: [string, "null"], description: 字段：directoryPath }
        snapshotAt: { type: [string, "null"], format: date-time, description: 字段：snapshotAt }

    KnowledgeMountsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              description: 响应数据
              type: object
              required: [mounts]
              properties:
                mounts:
                  description: 字段：mounts
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionContext:
      type: object
      required: [sessionId, knowledgeBaseIds]
      properties:
        sessionId: { type: string, description: 上传会话 ID }
        userId:
          type: [string, "null"]
          description: 触发本次请求的用户 ID（供 grc-agent-service 走 grc-python-sdk 的 for_user 凭据解析路径；为 null 时 agent-service 降级为静态凭据）
        knowledgeBaseIds:
          type: array
          items: { type: string }
          description: 已通过权限校验、当前生效的挂载知识库 ID 列表
        modelId: { type: [string, "null"], description: 字段：modelId }
        messages:
          description: 字段：messages
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant], description: 字段：role }
              content: { type: string, description: 内容 }
              citations:
                description: 字段：citations
                type: array
                items: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time, description: 创建时间 }

    ChatSessionContextEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionContext', description: 响应数据 }

    AppendMessageRequest:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant], description: 字段：role }
        content: { type: string, description: 内容 }
        citations:
          description: 字段：citations
          type: array
          items: { type: object, additionalProperties: true }
        toolCalls:
          description: 字段：toolCalls
          type: array
          items: { type: object, additionalProperties: true }
        thinkingProcess: { type: [string, "null"], description: 字段：thinkingProcess }

    AppendMessageResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              description: 响应数据
              type: object
              required: [messageId, createdAt]
              properties:
                messageId: { type: string, description: 字段：messageId }
                createdAt: { type: string, format: date-time, description: 创建时间 }

    ResolveModelResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              description: 响应数据
              type: object
              required: [resolved, credential, source]
              properties:
                resolved: { type: boolean, description: 字段：resolved }
                credential:
                  description: 字段：credential
                  type: object
                  required: [type, token]
                  properties:
                    type: { type: string, enum: [bearer, api_key], description: 类型 }
                    token: { type: string, description: 字段：token }
                source:
                  description: 字段：source
                  type: string
                  enum: [personal, platform_default]
                availableModels:
                  description: 字段：availableModels
                  type: array
                  items: { type: string }
