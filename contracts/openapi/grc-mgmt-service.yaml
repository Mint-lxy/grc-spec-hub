components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 会话 ID
      schema: { type: string }
    FileId: { name: fileId, in: path, required: true, description: 文件 ID, schema: { type: string } }
    DirectoryId: { name: directoryId, in: path, required: true, description: 知识目录 ID, schema: { type: integer, format: int64 } }
    KnowledgeBaseId: { name: kbId, in: path, required: true, description: 知识库 ID, schema: { type: string } }
    DocumentId: { name: docId, in: path, required: true, description: 文档 ID, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, description: 构建任务 ID, schema: { type: string } }
    OperationId: { name: operationId, in: path, required: true, description: 异步操作 ID, schema: { type: string } }
    ChunkId: { name: chunkId, in: path, required: true, description: 文档切片 ID, schema: { type: string } }
    StageType: { name: stageType, in: path, required: true, description: 文档处理阶段类型，取值：parse，chunk，enhance，embed, schema: { type: string } }
    AssetId: { name: assetId, in: path, required: true, description: 资产 ID, schema: { type: string } }
    FlowId: { name: flowId, in: path, required: true, description: 审批流 ID, schema: { type: string } }
    StepId: { name: stepId, in: path, required: true, description: 审批步骤 ID, schema: { type: string } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, description: 订阅 ID, schema: { type: string } }
    EvaluationId: { name: evaluationId, in: path, required: true, description: 测评 ID, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, description: 用户 ID, schema: { type: integer, format: int64 } }
    RoleId: { name: roleId, in: path, required: true, description: 角色 ID, schema: { type: integer, format: int64 } }
    PermissionId: { name: permissionId, in: path, required: true, description: 权限 ID, schema: { type: integer, format: int64 } }
    CredentialId: { name: id, in: path, required: true, description: 凭据 ID, schema: { type: integer, format: int64 } }
    TargetType: { name: targetType, in: path, required: true, description: 目标资源类型, schema: { type: string } }
    TargetId: { name: targetId, in: path, required: true, description: 目标资源 ID, schema: { type: string } }

  responses:
    SessionNotFound:
      description: sessionId 不存在、已删除，或不属于该请求用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    CreateMarketplaceAssetRequest:
      type: object
      required: [assetType, draftData]
      properties:
        assetType: { type: string, description: 资产类型，例如 AGENT 或 MCP }
        agentMode: { type: string, description: Agent 形态；MCP 资产不填写 }
        submit: { type: boolean, default: true, description: 创建后是否提交发布流程 }
        draftData:
          description: 字段：draftData
          $ref: '#/components/schemas/MarketplaceAssetDraftData'
    MarketplaceAssetDraftData:
      type: object
      required: [assetName]
      properties:
        assetName: { type: string, maxLength: 200, description: 资产名称 }
        category: { type: string, maxLength: 100, description: 业务分类 }
        description: { type: string, maxLength: 2000, description: 资产简介 }
        assetIcon: { type: string, description: 资产图标地址 }
        tagIds: { type: array, items: { type: integer, format: int64 }, description: 业务标签 ID 列表 }
        hostingMode: { type: string, description: 托管方式 }
        accessConfig: { type: object, additionalProperties: true, description: 资产接入配置 }
        authConfig: { type: object, additionalProperties: true, description: 资产鉴权配置 }
        capabilityConfig: { type: object, additionalProperties: true, description: 资产能力声明 }
        interfaceConfig: { type: object, additionalProperties: true, description: 接口清单配置 }
        platformGovernance: { $ref: '#/components/schemas/MarketplaceAssetPlatformGovernance', description: 平台治理配置 }
        manifestSnapshot: { type: object, additionalProperties: true, description: Agent Card 或 MCP Manifest 快照 }
        subscriptionFormYaml: { type: string, maxLength: 200000, description: 订阅申请表单 YAML }
        subscriptionApprovalEnabled: { type: boolean, description: 是否启用订阅审批 }
        subscriptionApprovers: { type: array, items: { $ref: '#/components/schemas/MarketplaceApprover' }, description: 订阅审批人配置 }
        releaseNote: { type: string, maxLength: 4000, description: 当前版本发布说明 }
        termsVersion: { type: string, description: 使用条款版本号 }
        termsContent: { type: string, description: 使用条款正文 }
    MarketplaceApprover:
      type: object
      required: [approverId, approverName, order]
      properties:
        approverId: { type: integer, format: int64, description: 审批人用户 ID }
        approverName: { type: string, maxLength: 100, description: 审批人姓名快照 }
        order: { type: integer, description: 审批层级 }
    MarketplaceAssetPlatformGovernance:
      type: object
      additionalProperties: true
      properties:
        guardrailTemplateId: { type: integer, format: int64, description: Agent 绑定的启用护栏模板 ID；Agent 提交时必填，MCP 不填写 }
    UpdateMarketplaceAssetRequest:
      allOf:
        - $ref: '#/components/schemas/MarketplaceAssetDraftData'
        - type: object
          properties:
            submit: { type: boolean, default: false, description: 是否提交完成的草稿进入质量门控；false 时仅保存 DRAFT }
    TransferMarketplaceOwnerRequest:
      type: object
      required: [targetOwnerId]
      properties:
        targetOwnerId: { type: integer, format: int64, description: 目标 Owner 用户 ID }
        targetOwnerName: { type: string, description: 目标 Owner 姓名快照 }
    YamlPreviewRequest:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string, description: 待解析的订阅表单 YAML }
    MarketplaceAssetHealthProbeRequest:
      type: object
      required: [assetType, endpointUrl, healthCheckUrl]
      properties:
        assetType: { type: string, enum: [AGENT, MCP], description: 资产类型 }
        endpointUrl: { type: string, format: uri, description: 服务接入地址 }
        healthCheckUrl: { type: string, format: uri, description: Health Check 探测地址 }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 120, default: 30, description: 单次探测超时秒数 }
        retryCount: { type: integer, minimum: 0, maximum: 3, default: 1, description: 失败重试次数 }
    MarketplaceAssetCapabilityPreviewRequest:
      type: object
      required: [assetType, endpointUrl]
      properties:
        assetType: { type: string, enum: [AGENT, MCP], description: 资产类型 }
        endpointUrl: { type: string, format: uri, description: Agent Card 或 MCP 工具清单的服务地址 }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 120, default: 30, description: 单次拉取超时秒数 }
        retryCount: { type: integer, minimum: 0, maximum: 3, default: 1, description: 失败重试次数 }
    ApprovalActionRequest:
      type: object
      properties:
        comment: { type: string, description: 审批意见或驳回原因 }
    SubmitSubscriptionRequest:
      type: object
      required: [bizSystem, reason, formData, termsAccepted]
      properties:
        bizSystem: { type: string, description: 申请使用的业务系统 }
        reason: { type: string, description: 申请使用场景或原因 }
        formData: { type: object, additionalProperties: true, description: 自定义订阅表单数据 }
        termsVersion: { type: string, description: 提交时确认的条款版本 }
        termsAccepted: { type: boolean, description: 是否同意使用条款 }
    ResubmitSubscriptionRequest:
      allOf: [{ $ref: '#/components/schemas/SubmitSubscriptionRequest' }]
    CancelSubscriptionRequest:
      type: object
      properties:
        reason: { type: string, description: 主动退订原因（可选，默认为用户主动退订） }
    FavoriteAssetRequest:
      type: object
      required: [assetId]
      properties:
        assetId: { type: integer, format: int64, description: 收藏的目标资产 ID }
    SaveSubscriptionSettingsRequest:
      type: object
      properties:
        subscriptionFormYaml: { type: string, maxLength: 200000, description: 订阅表单 YAML }
        termsVersion: { type: string, maxLength: 200, description: 条款版本号 }
        termsContent: { type: string, maxLength: 20000, description: 条款正文 }
    CreatorDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, description: 创作者审批决定 }
        comment: { type: string, description: 审批意见 }
    RevokeSubscriptionRequest:
      type: object
      properties:
        reason: { type: string, description: 撤销原因 }
    CreateEvaluationRequest:
      type: object
      properties:
        requiredTemplate: { type: string, description: 必选测评模板 }
        optionalTemplates: { type: array, items: { type: string }, description: 可选测评模板列表 }
    MarketplaceAssetDetail:
      type: object
      properties:
        assetId: { type: integer, format: int64, description: 资产 ID }
        assetName: { type: string, description: 资产名称 }
        assetType: { type: string, description: 资产类型 }
        agentMode: { type: string, description: Agent 形态 }
        status: { type: string, description: 生命周期状态 }
        ownerId: { type: integer, format: int64, description: Owner 用户 ID }
        ownerName: { type: string, description: Owner 用户名称 }
        description: { type: string, description: 资产简介 }
        category: { type: string, description: 业务分类 }
        assetIcon: { type: string, description: 资产图标地址 }
        tagIds: { type: array, items: { type: integer, format: int64 }, description: 标签 ID 列表 }
        tagNames: { type: array, items: { type: string }, description: 标签名称列表 }
        currentVersionId: { type: integer, format: int64, description: 当前版本 ID }
