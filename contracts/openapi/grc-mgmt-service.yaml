      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        expiresIn: { type: integer, minimum: 1 }
        scopes: { type: array, minItems: 1, items: { type: string } }

    RegeneratePatRequest:
      type: object
      properties:
        expiresIn: { type: integer, minimum: 1 }
        expectedUpdateTime: { type: string, format: date-time }

    UpdatePatStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }

    PatResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        fullToken: { type: string, writeOnly: true }
        tokenMasked: { type: string }
        scopes: { type: array, items: { type: string } }
        status: { type: string }
        ownerEmail: { type: string, format: email }
        description: { type: string }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isExpiringSoon: { type: boolean }
        warning: { type: string }

    PatPageResponse:
      type: object
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/PatResponse' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }

    CreateOutboundCredentialRequest:
      type: object
      required: [name, targetType, targetId, fields]
      properties:
        name: { type: string, minLength: 1 }
        targetType: { type: string, minLength: 1 }
        targetId: { type: string, minLength: 1 }
        fields: { type: object, additionalProperties: { type: string } }

    UpdateOutboundCredentialRequest:
      type: object
      required: [fields]
      properties:
        fields: { type: object, additionalProperties: { type: string } }

    AuthFieldInfo:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        secret: { type: boolean }
        readOnly: { type: boolean }
        configured: { type: boolean }
        maskedValue: { type: string }
        note: { type: string }

    OutboundCredentialResponse:
      type: object
      properties:
        credentialId: { type: string }
        credentialName: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        targetName: { type: string }
        authType: { type: string }
        endpoint: { type: string }
        protocol: { type: string }
        status: { type: string }
        syncStatus: { type: string }
        refCount: { type: integer }
        description: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/AuthFieldInfo' } }
        createTime: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    OutboundCredentialPageResponse:
      type: object
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/OutboundCredentialResponse' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }

    PermissionCheckRequest:
      type: object
      required: [checks]
      properties:
        userId: { type: integer, format: int64 }
        checks:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, target]
            properties:
              type: { type: string }
              target: { type: object, additionalProperties: true }

    PermissionCheckResponse:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        results:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              target: { type: object, additionalProperties: true }
              allowed: { type: boolean }
              matched: { type: boolean }
              scopes: { type: array, items: { type: string } }
              reason: { type: string }

    EffectivePermissionSetResponse:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        menuActions: { type: array, items: { type: object, properties: { code: { type: string }, path: { type: string }, method: { type: string } } } }
        dataScopes: { type: array, items: { type: object, properties: { code: { type: string }, scope: { type: string } } } }
        models: { type: array, items: { type: object, properties: { code: { type: string }, modelId: { type: string } } } }
        catalogs: { type: array, items: { type: object, properties: { code: { type: string }, catalogId: { type: string } } } }
        version: { type: string }
        expireAt: { type: string, format: date-time }

    VerifyTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }

    VerifyTokenResponse:
      type: object
      properties:
        valid: { type: boolean }
        credentialId: { type: string }
        ownerId: { type: string }
        tenantId: { type: string }
        scopes: { type: array, items: { type: string } }
        failReason: { type: string }

    UpdateOutboundCredentialStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }

    VoidEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { type: 'null' } } }] }
    UserEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/UserResponse' } } }] }
    UserPageEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/UserPageResponse' } } }] }
    RoleEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/RoleResponse' } } }] }
    RolePageEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/RolePageResponse' } } }] }
    PermissionEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/PermissionResponse' } } }] }
    PermissionPageEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/PermissionPageResponse' } } }] }
    ObjectEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { type: object, additionalProperties: true } } }] }
    PatEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/PatResponse' } } }] }
    PatPageEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/PatPageResponse' } } }] }
    OutboundCredentialEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/OutboundCredentialResponse' } } }] }
    OutboundCredentialPageEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/OutboundCredentialPageResponse' } } }] }
    PermissionCheckEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/PermissionCheckResponse' } } }] }
    EffectivePermissionSetEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/EffectivePermissionSetResponse' } } }] }
    VerifyTokenEnvelope: { allOf: [{ $ref: '#/components/schemas/ApiResponseBase' }, { type: object, properties: { data: { $ref: '#/components/schemas/VerifyTokenResponse' } } }] }

    VectorStoreInstance:
      type: object
      required: [resourceId, instance, displayName, type, region, capacity, load, available, defaultAvailable]
      properties:
        resourceId: { type: string }
        instance: { type: string }
        displayName: { type: string }
        type: { type: string, enum: [Milvus, PGVector] }
        region: { type: string }
        capacity: { type: string }
        load: { type: integer, minimum: 0, maximum: 100 }
        available: { type: boolean }
        defaultAvailable: { type: boolean }

    DirectoryTreeResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            data:
              type: object
              required: [public, personal]
              properties:
                public:
                  type: array
                  items: { $ref: '#/components/schemas/DirectoryTreeNode' }
                personal:
                  type: array
                  items: { $ref: '#/components/schemas/DirectoryTreeNode' }

    DirectoryTreeNode:
      type: object
      required: [id, name, directoryType, children, permissionItems]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId: { type: [integer, 'null'], format: int64 }
        path: { type: string }
        childrenCount: { type: integer }
        kbCount: { type: integer }
        directoryType: { type: string, enum: [PUBLIC, PERSONAL] }
        aliceSyncStatus: { type: [string, 'null'] }
        permissionItems:
          type: array
          items: { $ref: '#/components/schemas/DirectoryPermissionItem' }
        children:
          type: array
          items: { $ref: '#/components/schemas/DirectoryTreeNode' }

    DirectoryPermissionItem:
      type: object
      required: [permissionCode, permissionName, granted, canApply]
      properties:
        permissionCode: { type: string, enum: [DIR_CONTROL, KB_CREATOR] }
        permissionName: { type: string }
        roleId: { type: [string, 'null'] }
        entitlementId: { type: [string, 'null'] }
        granted: { type: boolean }
        canApply: { type: boolean }
        applyUrl: { type: [string, 'null'] }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
        traceId: { type: string }

    ChatSessionSummary:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        assetId: { type: [string, "null"] }
        assetName: { type: [string, "null"] }
        title: { type: string }
        modelId: { type: [string, "null"] }
        lastMessageAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ChatSessionSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionSummary' }

    ChatSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ChatSessionSummary' }
                total: { type: integer }

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              knowledgeBaseId: { type: string }
              docId: { type: string }
              chunkId: { type: [string, "null"] }
              content: { type: string }
              score: { type: number, format: float }
        toolCalls:
          type: array
          items:
            type: object
            properties:
              toolName: { type: string }
              arguments: { type: object, additionalProperties: true }
              resultSummary: { type: string }
        thinkingProcess:
          type: [string, "null"]
          description: 深度分析模式下的思考过程（可折叠有序步骤，格式待细化）
        createdAt: { type: string, format: date-time }

    ChatSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            knowledgeMounts:
              type: array
              items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionDetail' }

    KnowledgeMount:
      type: object
      required: [knowledgeBaseId, name]
      properties:
        knowledgeBaseId: { type: string }
        name: { type: string }
        directoryPath: { type: [string, "null"] }
        snapshotAt: { type: [string, "null"], format: date-time }

    KnowledgeMountsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [mounts]
              properties:
                mounts:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMount' }

    ChatSessionContext:
      type: object
      required: [sessionId, knowledgeBaseIds]
      properties:
        sessionId: { type: string }
        userId:
          type: [string, "null"]
          description: 触发本次请求的用户 ID（供 grc-agent-service 走 grc-python-sdk 的 for_user 凭据解析路径；为 null 时 agent-service 降级为静态凭据）
        knowledgeBaseIds:
          type: array
          items: { type: string }
          description: 已通过权限校验、当前生效的挂载知识库 ID 列表
        modelId: { type: [string, "null"] }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              citations:
                type: array
                items: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }

    ChatSessionContextEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChatSessionContext' }

    AppendMessageRequest:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { type: object, additionalProperties: true }
        toolCalls:
          type: array
          items: { type: object, additionalProperties: true }
        thinkingProcess: { type: [string, "null"] }

    AppendMessageResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [messageId, createdAt]
              properties:
                messageId: { type: string }
                createdAt: { type: string, format: date-time }

    ResolveModelResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [resolved, credential, source]
              properties:
                resolved: { type: boolean }
                credential:
                  type: object
                  required: [type, token]
                  properties:
                    type: { type: string, enum: [bearer, api_key] }
                    token: { type: string }
                source:
                  type: string
                  enum: [personal, platform_default]
                availableModels:
                  type: array
                  items: { type: string }
