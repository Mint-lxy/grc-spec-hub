openapi: 3.1.0
info:
  title: GRC Management Service API
  version: "2.1"
  description: >-
    grc-mgt-service 的对外契约，覆盖 chat、文件、知识库、marketplace、RBAC 与 vault 管理接口。
    其中 chat 会话子域
    （对应 specs/001-conversation/plan.md，api-landscape.md §3.7）：会话 CRUD、
    知识库挂载管理，以及两个供 grc-agent-service 调用的内部接口；② 凭据库的模型调用解析
    接口（对应 specs/007-credential/plan.md，ADR-003/ADR-005，api-landscape.md §3.5）：
    `POST /mgmt/vault/inbound/tokens/verify` 与 `GET /mgmt/vault/outbound/credentials/{id}/resolve`。
    其余接口按照对应 feature spec（002~006、008）持续补充，具体字段契约以各 feature
    contract 和实现同步更新为准。
servers:
  - url: https://api.internal/api/v1
    description: 经 grc-api-gateway 转发后的路径（网关统一加 /api/v1 前缀，内部路由本身以 /mgmt 为前缀）
security:
  - bearerAuth: []
tags:
  - name: ChatSession
    description: 会话创建、查询、重命名、删除与知识库挂载管理。
  - name: ChatSessionInternal
    description: 供 grc-agent-service 调用的会话上下文与消息回写内部接口。
  - name: VaultInternal
    description: 历史凭据内部接口分组；当前实现以 Internal Vault API 为准。
  - name: File Management
    description: 文件上传会话、下载地址、文件详情、删除与结果文件登记。
  - name: MCP File Connector
    description: MCP 外部文件资源连接器 (Confluence/SharePoint/S3) 目录预览与知识库导入。
  - name: Internal File
    description: 历史内部文件接口分组；当前实现未启用独立内部文件 controller。
  - name: Knowledge Directory
    description: 知识目录树、目录创建、重命名、更新与删除。
  - name: Knowledge Base
    description: 知识库生命周期、配置、文档、构建任务、统计与发布状态管理。
  - name: Knowledge Platform Resource
    description: 平台向量库等知识构建依赖资源查询。
  - name: Knowledge Document & Job
    description: 文档阶段执行、构建任务状态、取消与重试。
  - name: Knowledge Retrieval
    description: 知识检索请求与结果返回。
  - name: Knowledge Permission
    description: 知识目录与知识库授权查询。
  - name: Marketplace Asset
    description: Marketplace 资产创建、查询、更新、发布、下架、归档与预检。
  - name: Marketplace Approval
    description: Marketplace 审批流查询与审批操作。
  - name: Marketplace Creator Center
    description: 创作者中心统计、资产控制台、待审批订阅与待发布资产。
  - name: Marketplace Subscription
    description: 订阅初始化、提交、查询、重新申请与取消。
  - name: Marketplace Favorites
    description: 个人收藏新增、取消与列表查询。
  - name: Marketplace Tags
    description: Marketplace 标签查询。
  - name: Marketplace Guardrail Templates
    description: 创建向导可选的启用护栏策略模板查询。
  - name: User Management
    description: 用户创建、查询、更新、删除、启用、禁用与锁定。
  - name: Role Management
    description: 角色创建、查询、更新、删除、启用与禁用。
  - name: Permission Management
    description: 权限创建、查询、更新、删除、启用与禁用。
  - name: Permission Check
    description: 面向前端或调用方的权限检查接口。
  - name: Effective Permission
    description: 查询当前用户或指定用户的有效权限集合。
  - name: Internal Permission Check
    description: 服务间内部权限检查接口。
  - name: Role-Permission Binding
    description: 角色与权限绑定关系维护。
  - name: User-Role Binding
    description: 用户与角色绑定关系维护。
  - name: Inbound PAT Management
    description: 入站 PAT 创建、查询、删除、重生成、状态更新与统计。
  - name: Outbound Credential Management
    description: 出站凭据创建、查询、更新、删除、状态维护、预设与统计。
  - name: Internal Vault API
    description: PAT 验证与出站凭据解析等内部 vault 能力。
  - name: Vault Audit
    description: 凭据审计日志查询。
paths:
  /mgmt/chat/sessions:
    post:
      tags: [ChatSession]
      operationId: createChatSession
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type: [string, "null"]
                  description: 资产透传会话的资产 ID；平台 Chat 会话为空
                modelId:
                  description: 模型 ID
                  type: [string, "null"]
                title:
                  description: 标题
                  type: [string, "null"]
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'

    get:
      tags: [ChatSession]
      operationId: listChatSessions
      summary: 会话列表
      parameters:
        - name: page
          description: 当前页码
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          description: 每页数量
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          required: false
          description: 匹配会话标题
          schema: { type: string }
        - name: assetId
          description: 资产 ID
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'

  /mgmt/chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [ChatSession]
      operationId: getChatSessionDetail
      summary: 会话详情（含历史消息）
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetailEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    patch:
      tags: [ChatSession]
      operationId: renameChatSession
      summary: 重命名会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 128, description: 标题 }
      responses:
        '200':
          description: 更新后的会话摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionSummaryEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    delete:
      tags: [ChatSession]
      operationId: deleteChatSession
      summary: 删除会话（软删除，消息记录保留审计留痕）
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/chat/sessions/{sessionId}/knowledge-mounts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [ChatSession]
      operationId: setKnowledgeMounts
      summary: 挂载/卸载知识库
      description: >-
        挂载前对每个 knowledgeBaseId 做 RBAC 权限校验（复用 `/mgmt/internal/check`，
        `CATALOG` 类型）；无权限的 ID 静默剔除，返回实际生效的 mounts[]，不整体报错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBaseIds]
              properties:
                knowledgeBaseIds:
                  description: 知识库 ID 列表
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 实际生效的挂载结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    get:
      tags: [ChatSession]
      operationId: getKnowledgeMounts
      summary: 已挂载知识库列表
      responses:
        '200':
          description: 已挂载知识库列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMountsEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/internal/chat/sessions/{sessionId}/context:
    get:
      tags: [ChatSessionInternal]
      operationId: getChatSessionContextInternal
      summary: '[内部] 查询会话上下文（供 grc-agent-service 调用）'
      description: >-
        grc-agent-service 在处理 `POST /chat/sessions/{sessionId}/messages`
        （见 grc-agent-service.yaml）时同步调用本接口，取挂载的知识库 ID 与历史消息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: includeHistory
          description: 是否包含历史消息
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 会话上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionContextEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/internal/chat/sessions/{sessionId}/messages:
    post:
      tags: [ChatSessionInternal]
      operationId: appendChatMessageInternal
      summary: '[内部] 追加一条已生成的消息（供 grc-agent-service 在生成完成后回写）'
      description: >-
        待评审确认：生成中途失败/被中止时是否仍调用本接口回写部分内容
        （见 specs/001-conversation/plan.md 待评审确认项）。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '200':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendMessageResponseEnvelope'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /mgmt/file/files/upload-sessions:
    post:
      tags: [File Management]
      operationId: createUploadSession
      summary: 创建上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadSessionRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadSessionResponseEnvelope' } } } } }
  /mgmt/file/files/upload-sessions/batch:
    post:
      tags: [File Management]
      operationId: createUploadSessions
      summary: 批量创建上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreateUploadSessionRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreateUploadSessionResponseEnvelope' } } } } }
  /mgmt/file/files/upload-sessions/{sessionId}/complete:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [File Management]
      operationId: completeUploadSession
      summary: 完成上传会话
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteUploadRequest' } } }
      responses: { '200': { description: 完成成功, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteUploadResponseEnvelope' } } } } }
  /mgmt/file/files/{fileId}:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    get:
      tags: [File Management]
      operationId: getFileDetail
      summary: 查询文件详情
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/FileDetailResponseEnvelope' } } } } }
    delete:
      tags: [File Management]
      operationId: deleteFile
      summary: 删除文件
      responses: { '200': { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteFileResponseEnvelope' } } } } }
  /mgmt/file/files/{fileId}/download-url:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    post:
      tags: [File Management]
      operationId: createDownloadUrl
      summary: 创建文件下载地址
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadUrlResponseEnvelope' } } } } }
  /mgmt/file/files/results:
    post:
      tags: [File Management]
      operationId: registerResultFile
      summary: 登记结果文件
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileRequest' } } }
      responses: { '200': { description: 登记成功, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResultFileResponseEnvelope' } } } } }
  /mgmt/knowledge/mcp/connectors/preview-tree:
    post:
      tags: [MCP File Connector]
      operationId: previewMcpConnectorTree
      summary: 获取 MCP 外部文件资源连接器目录树预览
      description: 解析 Confluence, SharePoint/OneDrive 或 S3/Blob 远程目录结构与文件可导入状态
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectorTreeRequest' } } }
      responses: { '200': { description: 预览成功, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectorTreeEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/mcp-imports:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [MCP File Connector]
      operationId: importMcpFilesToKnowledgeBase
      summary: MCP 选定文件处理并导入知识库
      description: 转换勾选节点获得 fileId 数组，并调用 facadeService.importDocuments(kbId, request) 写入知识库
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpImportRequest' } } }
      responses: { '200': { description: 导入成功, content: { application/json: { schema: { $ref: '#/components/schemas/McpImportEnvelope' } } } } }
  /mgmt/knowledge/directories/tree:
    get:
      tags: [Knowledge Directory]
      operationId: getDirectoryTree
      summary: 查询知识目录树
      parameters:
        - { name: includeKbCount, in: query, description: 是否包含知识库数量, schema: { type: boolean, default: false } }
        - { name: keyword, in: query, description: 搜索关键词, required: false, schema: { type: string } }
        - { name: directoryType, in: query, description: 目录类型, required: false, schema: { type: string, enum: [PUBLIC, PERSONAL] } }
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryTreeResponse' } } } } }
  /mgmt/knowledge/directories:
    post:
      tags: [Knowledge Directory]
      operationId: createDirectory
      summary: 创建知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDirectoryRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
  /mgmt/knowledge/directories/{directoryId}/rename:
    parameters: [{ $ref: '#/components/parameters/DirectoryId' }]
    patch:
      tags: [Knowledge Directory]
      operationId: renameDirectory
      summary: 重命名知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameDirectoryRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
  /mgmt/knowledge/directories/{directoryId}:
    parameters: [{ $ref: '#/components/parameters/DirectoryId' }]
    patch:
      tags: [Knowledge Directory]
      operationId: updateDirectory
      summary: 更新知识目录
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDirectoryRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryDetailEnvelope' } } } } }
    delete:
      tags: [Knowledge Directory]
      operationId: deleteDirectory
      summary: 删除知识目录
      responses: { '200': { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteDirectoryEnvelope' } } } } }

  /mgmt/knowledge/tags:
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeTag
      summary: 创建知识库标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeTagRequest' }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeTagEnvelope' } } } } }
    get:
      tags: [Knowledge Base]
      operationId: listKnowledgeTags
      summary: 查询知识库标签
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeTagListEnvelope' } } } } }

  /mgmt/knowledge/knowledge-bases:
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeBase
      summary: 创建知识库
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKnowledgeBaseRequest' } } }
      responses: { '200': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseCreateEnvelope' } } } } }
    get:
      tags: [Knowledge Base]
      operationId: listKnowledgeBases
      summary: 查询知识库列表
      parameters:
        - { name: directoryId, in: query, description: 目录 ID, required: false, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, description: 搜索关键词, required: false, schema: { type: string } }
        - { name: status, in: query, description: 状态过滤条件状态：DRAFT\ACTIVE\DISABLED, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, DISABLED] } }
        - { name: retrievalReady, in: query, description: 是否仅查询已可检索数据, required: false, schema: { type: boolean } }
        - { name: page, in: query, description: 当前页码, required: false, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, description: 每页数量, required: false, schema: { type: integer, minimum: 1 } }
        - name: sort
          in: query
          description: >-
            单字段排序规则，格式为 field:asc 或 field:desc；仅支持
            documentCount、chunkCount、vectorCount、coverage。
          required: false
          schema:
            type: string
            pattern: '^(documentCount|chunkCount|vectorCount|coverage):(asc|desc)$'
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBasePageEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/pipeline-options:
    get:
      tags: [Knowledge Base]
      operationId: getKnowledgePipelineOptions
      summary: 查询知识管线选项
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgePipelineOptionsEnvelope' } } } } }
  /mgmt/knowledge/platform-resources/vector-store-instances:
    get:
      tags: [Knowledge Platform Resource]
      operationId: listVectorStoreInstances
      summary: 查询可用向量库实例
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [Milvus, PGVector] }
          description: 按向量库类型筛选。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data:
                        description: 响应数据
                        type: array
                        items: { $ref: '#/components/schemas/VectorStoreInstance' }
  /mgmt/knowledge/knowledge-bases/stats:
    get:
      tags: [Knowledge Base]
      operationId: getKnowledgeBaseAggregateStatistics
      summary: 查询知识库聚合统计
      description: 查询所有知识库、可用文档和切片的聚合统计，以及未就绪知识库的原因分布。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseAggregateStatisticsEnvelope'
  /mgmt/knowledge/knowledge-bases/default-pipeline-config:
    get:
      tags: [Knowledge Base]
      operationId: getDefaultKnowledgePipelineConfig
      summary: 查询知识库默认管线配置
      description: 返回创建知识库时的默认解析、切片、增强、向量化和向量库存储配置。该接口无入参。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePipelineDefaultConfigEnvelope'
  /mgmt/knowledge/knowledge-bases/{kbId}:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    get:
      tags: [Knowledge Base]
      operationId: getKnowledgeBaseDetail
      summary: 查询知识库详情
      responses: { '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseDetailEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/config:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    patch:
      tags: [Knowledge Base]
      operationId: updateKnowledgeBaseConfig
      summary: 更新知识库配置
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseConfigRequest' } } }
      responses: { '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseConfigUpdateEnvelope' } } } } }
  /mgmt/knowledge/knowledge-bases/{kbId}/documents:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      tags: [Knowledge Base]
      operationId: createKnowledgeDocument
      summary: 创建知识库文档
      description: 向指定知识库创建/导入单份文档并可触发自动构建
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKnowledgeDocumentRequest' } } }
