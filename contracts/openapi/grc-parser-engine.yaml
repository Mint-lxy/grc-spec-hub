openapi: 3.1.0
info:
  title: GRC Parser Engine API
  version: "1.0"
  description: >-
    grc-knowledge-engine 调用的异步文档解析契约。Parser 生成短期 ParsedDocumentSnapshot、
    Markdown 正文和媒体资产；消费方持久化后必须 acknowledge，以便立即清理临时字节。
servers:
  - url: https://parser.grc.internal/v1
security:
  - serviceBearer: []
tags:
  - name: parse-jobs
paths:
  /parse:
    post:
      tags: [parse-jobs]
      operationId: createParseJob
      summary: 创建异步解析任务
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParseJobRequest'
      responses:
        '202':
          description: 任务已排队；同一调用方以相同幂等键和稳定请求重放时返回首次任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseJobAcceptedEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /parse/{parseJobId}:
    get:
      tags: [parse-jobs]
      operationId: getParseJob
      summary: 查询解析任务状态
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
      responses:
        '200':
          description: "任务状态。QUEUED/RUNNING 时响应包含 Retry-After: 1。"
          headers:
            Retry-After:
              description: 建议轮询间隔（秒），仅非终态返回。
              schema: { type: string, pattern: '^[0-9]+$' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseJobStatusEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /parse/{parseJobId}/result:
    get:
      tags: [parse-jobs]
      operationId: getParseResult
      summary: 分页读取规范化解析快照
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
        - name: elementCursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: assetCursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: 解析快照页。
          headers:
            ETag:
              description: 快照 SHA-256 标识。
              schema: { $ref: '#/components/schemas/Sha256' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResultEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }
  /parse/{parseJobId}/content:
    get:
      tags: [parse-jobs]
      operationId: getParsedContent
      summary: 读取解析后的 Markdown 正文
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
      responses:
        '200':
          description: Markdown 字节。
          headers:
            ETag: { schema: { $ref: '#/components/schemas/Sha256' } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            X-Content-SHA256: { schema: { $ref: '#/components/schemas/Sha256' } }
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }
  /parse/{parseJobId}/assets/{assetId}/content:
    get:
      tags: [parse-jobs]
      operationId: getParseAssetContent
      summary: 读取解析资产字节
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
        - $ref: '#/components/parameters/AssetId'
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=[0-9]*-[0-9]*$' }
      responses:
        '200':
          description: 完整资产字节；Content-Type 取自资产 mediaType。
          headers:
            ETag: { schema: { $ref: '#/components/schemas/Sha256' } }
            X-Content-SHA256: { schema: { $ref: '#/components/schemas/Sha256' } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 指定的部分资产字节。
          headers:
            ETag: { schema: { $ref: '#/components/schemas/Sha256' } }
            X-Content-SHA256: { schema: { $ref: '#/components/schemas/Sha256' } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }
  /parse/{parseJobId}/acknowledge:
    post:
      tags: [parse-jobs]
      operationId: acknowledgeParseResult
      summary: 确认消费结果并清理临时内容
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '200':
          description: 清理回执；相同幂等请求返回相同结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }
  /parse/{parseJobId}/cancel:
    post:
      tags: [parse-jobs]
      operationId: cancelParseJob
      summary: 取消尚未进入不可中断阶段的任务
      parameters:
        - $ref: '#/components/parameters/ParseJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 取消已接受。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseJobStatusEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /capabilities:
    get:
      tags: [parse-jobs]
      operationId: getParserCapabilities
      summary: 查询部署能力与契约限制
      responses:
        '200':
          description: 当前部署能力。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      tags: [parse-jobs]
      operationId: getParserHealth
      summary: 存活探针
      security: []
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /readyz:
    get:
      tags: [parse-jobs]
      operationId: getParserReadiness
      summary: 就绪探针
      security: []
      responses:
        '200':
          description: 服务可接受解析任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
        '503':
          description: 一个或多个就绪检查失败。响应仍使用成功包络，以 data.ready 表示状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: 服务间身份令牌。
  parameters:
    ParseJobId:
      name: parseJobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID 幂等键；同一服务身份、操作和键的稳定请求在 24 小时内返回首次结果。
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 请求、幂等键、cursor、Range、来源完整性或 snapshot identity 无效。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: 缺少或无效的 service bearer。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: 服务身份无权访问。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: 任务或资产不存在。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: 状态冲突、结果未就绪或幂等冲突。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Gone:
      description: 结果已 acknowledge 或 TTL 清理。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UnprocessableEntity:
      description: 请求的解析器或必需图片描述能力当前不可用。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    InternalError:
      description: 未分类内部错误。
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ServiceUnavailable:
      description: 来源授权或来源当前不可用。
      headers:
        Retry-After: { schema: { type: string, pattern: '^[0-9]+$' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    Sha256:
      type: string
      pattern: '^sha256:[a-fA-F0-9]{64}$'
    Timestamp:
      type: string
      format: date-time
    TraceId:
      type: string
      minLength: 16
      maxLength: 64
    SuccessEnvelopeBase:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { type: string, const: '0' }
        message: { type: string, const: success }
        data: {}
        traceId: { $ref: '#/components/schemas/TraceId' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    ParseJobAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ParseJobAccepted' }
    ParseJobStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ParseJobStatus' }
    ParseResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ParsedDocumentSnapshot' }
    AcknowledgeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AcknowledgeReceipt' }
    CapabilityEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Capabilities' }
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Health' }
    ReadinessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Readiness' }
    CreateParseJobRequest:
      type: object
      required: [documentId, documentVersionId, source, parser, configFingerprint]
      properties:
        documentId: { type: integer, minimum: 1 }
        documentVersionId: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceReference' }
        parser: { $ref: '#/components/schemas/ParserConfig' }
        pageRange: { $ref: '#/components/schemas/PageRange' }
        configFingerprint: { type: string, minLength: 16, maxLength: 128 }
      additionalProperties: false
    SourceReference:
      type: object
      required: [fileId, mediaType, contentHash, byteSize, accessGrant]
      properties:
        fileId: { type: string, minLength: 1, maxLength: 256 }
        mediaType: { type: string, minLength: 1, maxLength: 255 }
        contentHash: { $ref: '#/components/schemas/Sha256' }
        byteSize: { type: integer, minimum: 1, maximum: 41943040 }
        accessGrant: { $ref: '#/components/schemas/AccessGrant' }
      additionalProperties: false
    AccessGrant:
      type: object
      required: [grantId, accessUrl, expiresAt, audience, maxUses]
      properties:
        grantId: { type: string, minLength: 1, maxLength: 256 }
        accessUrl: { type: string, minLength: 1, maxLength: 4096 }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        audience: { type: string, const: grc-parser-engine }
        maxUses: { type: integer, const: 1 }
      additionalProperties: false
    ParserConfig:
      type: object
      required: [type, parseMethod, language, tableEnabled, formulaEnabled, imageMode, imageDescriptionEnabled, imageClassificationEnabled, codeEnabled, layoutEffort]
      properties:
        type: { type: string, enum: [DOCLING, MINERU, DEEPDOC, AZURE_DOCUMENT_INTELLIGENCE] }
        parseMethod: { type: string, enum: [TEXT, OCR] }
        language: { type: string, enum: [AUTO, ZH, EN, ZH_EN, JA] }
        tableEnabled: { type: boolean }
        formulaEnabled: { type: boolean }
        imageMode: { type: string, enum: [IGNORE, EXTRACT_NO_OCR, EXTRACT_AND_OCR] }
        imageDescriptionEnabled: { type: boolean }
        imageClassificationEnabled: { type: boolean }
        codeEnabled: { type: boolean }
        layoutEffort: { type: string, enum: [LOW, MEDIUM, HIGH] }
      allOf:
        - if:
            properties:
              imageMode: { enum: [EXTRACT_NO_OCR, EXTRACT_AND_OCR] }
            required: [imageMode]
          then:
            properties:
              imageDescriptionEnabled: { const: true }
      additionalProperties: false
    PageRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, minimum: 1 }
        end: { type: integer, minimum: 1, maximum: 5000 }
      additionalProperties: false
    AcknowledgeRequest:
      type: object
      required: [snapshotId, snapshotHash, outcome]
      properties:
        snapshotId: { type: string, format: uuid }
        snapshotHash: { $ref: '#/components/schemas/Sha256' }
        outcome: { type: string, enum: [PERSISTED, DISCARDED] }
      additionalProperties: false
    ParseJobAccepted:
      type: object
      required: [parseJobId, status, documentVersionId, parserFingerprint]
      properties:
        parseJobId: { type: string, format: uuid }
        status: { type: string, const: QUEUED }
        documentVersionId: { type: string, format: uuid }
        parserFingerprint: { type: string, minLength: 1 }
      additionalProperties: false
    ParseJobStatus:
      type: object
      required: [parseJobId, documentVersionId, status, attempt, maxAttempts, stage, progress, parserFingerprint, startedAt, finishedAt, error]
      properties:
        parseJobId: { type: string, format: uuid }
        documentVersionId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        stage: { type: string, enum: [VALIDATE, FETCH_SOURCE, PARSE, DESCRIBE_IMAGES, COMPLETE] }
        progress: { type: number, minimum: 0, maximum: 1 }
        parserFingerprint: { type: string, minLength: 1 }
        startedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        finishedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        error: { oneOf: [{ $ref: '#/components/schemas/ParseFailure' }, { type: 'null' }] }
      additionalProperties: false
    ParseFailure:
      type: object
      required: [code, reason, retryable, detail]
      properties:
        code: { type: string, pattern: '^PARSE-[0-9]{4}$' }
        reason: { type: string, minLength: 1 }
        retryable: { type: boolean }
        detail: { type: string }
      additionalProperties: false
    ParsedDocumentSnapshot:
      type: object
      required: [snapshotId, snapshotHash, documentId, documentVersionId, parserType, parserVersion, parserFingerprint, contentFormat, language, pageCount, pages, elements, assets, assetTexts, content, outline, warnings, statistics, nextElementCursor, nextAssetCursor]
      properties:
        snapshotId: { type: string, format: uuid }
        snapshotHash: { $ref: '#/components/schemas/Sha256' }
        documentId: { type: integer, minimum: 1 }
        documentVersionId: { type: string, format: uuid }
        parserType: { type: string, enum: [DOCLING, MINERU, DEEPDOC, AZURE_DOCUMENT_INTELLIGENCE] }
        parserVersion: { type: string, minLength: 1 }
        parserFingerprint: { type: string, minLength: 1 }
        contentFormat: { type: string, const: MARKDOWN }
        language: { type: string, enum: [ZH, EN, MIXED, UNKNOWN] }
        pageCount: { type: integer, minimum: 0, maximum: 20000 }
        pages: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/ParsedPage' } }
        elements: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/ParsedElement' } }
        assets: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/ParsedAsset' } }
        assetTexts: { type: array, items: { $ref: '#/components/schemas/AssetText' } }
        content: { $ref: '#/components/schemas/ContentReference' }
        outline: { type: array, items: { $ref: '#/components/schemas/OutlineItem' } }
        warnings: { type: array, items: {} }
        statistics: { $ref: '#/components/schemas/ParseStatistics' }
        nextElementCursor: { type: [string, 'null'], maxLength: 2048 }
        nextAssetCursor: { type: [string, 'null'], maxLength: 2048 }
      additionalProperties: false
    ParsedPage:
      type: object
      required: [pageIndex, width, height, coordinateSystem]
      properties:
        pageIndex: { type: integer, minimum: 1 }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        coordinateSystem: { type: string, const: PDF_POINTS }
      additionalProperties: false
    ParsedElement:
      type: object
      required: [elementId, type, sequence, pageIndex, sectionPath, normalizedText, assetId]
      properties:
        elementId: { type: string, format: uuid }
        type: { type: string, enum: [TITLE, PARAGRAPH, LIST, TABLE, IMAGE, CHART, CODE, FORMULA, FOOTER] }
        sequence: { type: integer, minimum: 0 }
        pageIndex: { type: integer, minimum: 1 }
        sectionPath: { type: array, items: { type: string } }
        normalizedText: { type: [string, 'null'] }
        assetId: { type: [string, 'null'], format: uuid }
        bbox: { $ref: '#/components/schemas/BoundingBox' }
        sourceOffset: { $ref: '#/components/schemas/SourceOffset' }
      additionalProperties: false
    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
      additionalProperties: false
    SourceOffset:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
      additionalProperties: false
    ParsedAsset:
      type: object
      required: [assetId, sourceElementId, assetType, contentHash, mediaType, width, height, extractionStatus]
      properties:
        assetId: { type: string, format: uuid }
        sourceElementId: { type: string, format: uuid }
        assetType: { type: string, enum: [IMAGE, CHART, ILLUSTRATION, TABLE_RENDER] }
        contentHash: { $ref: '#/components/schemas/Sha256' }
        mediaType: { type: string, minLength: 1 }
        width: { type: [integer, 'null'], minimum: 0 }
        height: { type: [integer, 'null'], minimum: 0 }
        extractionStatus: { type: string, const: READY }
      additionalProperties: false
    AssetText:
      type: object
      required: [assetId, textType, ordinal, content, contentHash, language, status, sourceFingerprint, imageHash, modelFingerprint, promptFingerprint, parserFingerprint, confidence, failureCode]
      properties:
        assetId: { type: string, format: uuid }
        textType: { type: string, enum: [TABLE_TEXT, ORIGINAL_CAPTION, OCR_TEXT, GENERATED_DESCRIPTION] }
        ordinal: { type: integer, minimum: 0 }
        content: { type: string }
        contentHash: { $ref: '#/components/schemas/Sha256' }
        language: { type: [string, 'null'] }
        status: { type: string, const: READY }
        sourceFingerprint: { type: string }
        imageHash: { $ref: '#/components/schemas/Sha256' }
        modelFingerprint: { type: [string, 'null'] }
        promptFingerprint: { type: [string, 'null'] }
        parserFingerprint: { type: string }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        failureCode: { type: [string, 'null'] }
      additionalProperties: false
    ContentReference:
      type: object
      required: [mediaType, contentHash, charCount, action]
      properties:
        mediaType: { type: string, const: text/markdown }
        contentHash: { $ref: '#/components/schemas/Sha256' }
        charCount: { type: integer, minimum: 0, maximum: 50000000 }
        action: { type: string, pattern: '^/parse/[0-9a-fA-F-]{36}/content$' }
      additionalProperties: false
    OutlineItem:
      type: object
      required: [title, level, elementId]
      properties:
        title: { type: string, maxLength: 512 }
        level: { type: integer, minimum: 1, maximum: 32 }
        elementId: { type: string, format: uuid }
      additionalProperties: false
    ParseStatistics:
      type: object
      required: [characters, tables, images, generatedDescriptions]
      properties:
        characters: { type: integer, minimum: 0 }
        tables: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
        generatedDescriptions: { type: integer, minimum: 0 }
      additionalProperties: false
    AcknowledgeReceipt:
      type: object
      required: [parseJobId, snapshotId, outcome, acknowledgedAt, temporaryContentPurged]
      properties:
        parseJobId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        outcome: { type: string, enum: [PERSISTED, DISCARDED] }
        acknowledgedAt: { $ref: '#/components/schemas/Timestamp' }
        temporaryContentPurged: { type: boolean, const: true }
      additionalProperties: false
    Capabilities:
      type: object
      required: [schemaVersion, parsers, imageDescription, limits]
      properties:
        schemaVersion: { type: string, const: '1' }
        parsers: { type: array, items: { $ref: '#/components/schemas/ParserCapability' } }
        imageDescription: { $ref: '#/components/schemas/ImageDescriptionCapability' }
        limits: { $ref: '#/components/schemas/ParserLimits' }
      additionalProperties: false
    ParserCapability:
      type: object
      required: [type, available, reason, version, fingerprint, supportedMediaTypes]
      properties:
        type: { type: string, enum: [DOCLING, MINERU, DEEPDOC, AZURE_DOCUMENT_INTELLIGENCE] }
        available: { type: boolean }
        reason: { type: string }
        version: { type: string }
        fingerprint: { type: string }
        supportedMediaTypes: { type: array, items: { type: string } }
      additionalProperties: false
    ImageDescriptionCapability:
      type: object
      required: [available, reason, modelFingerprint]
      properties:
        available: { type: boolean }
        reason: { type: string }
        modelFingerprint: { type: string }
      additionalProperties: false
    ParserLimits:
      type: object
      required: [maxSourceBytes, maxPages, maxElements, maxAssets, maxMarkdownCharacters, maxResultPageSize]
      properties:
        maxSourceBytes: { type: integer, const: 41943040 }
        maxPages: { type: integer, const: 20000 }
        maxElements: { type: integer, const: 1000000 }
        maxAssets: { type: integer, const: 10000 }
        maxMarkdownCharacters: { type: integer, const: 50000000 }
        maxResultPageSize: { type: integer, const: 1000 }
      additionalProperties: false
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: grc-parser-engine }
        version: { type: string }
      additionalProperties: false
    Readiness:
      type: object
      required: [status, ready, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        ready: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/ReadinessCheck' } }
      additionalProperties: false
    ReadinessCheck:
      type: object
      required: [name, status]
      properties:
        name: { type: string, enum: [POSTGRESQL, SERVICE_BUS, ARTIFACT_WORKSPACE, ACTIVE_PARSER] }
        status: { type: string, enum: [UP, DOWN] }
      additionalProperties: false
    ProblemDetails:
      type: object
      description: RFC 9457 风格的服务错误扩展。
      required: [code, message, detail, traceId, timestamp, path, status, reason, retryable, retryAfterSeconds, parseJobId, failedElementId]
      properties:
        code:
          type: string
          enum: [AUTH-2001, AUTH-2003, PARSE-1001, PARSE-1002, PARSE-3001, PARSE-3002, PARSE-3003, PARSE-3004, PARSE-4001, PARSE-4002, PARSE-4003, PARSE-9001, PARSE-9002, PARSE-9004]
        message: { type: string, minLength: 1 }
        detail: { type: string }
        traceId: { $ref: '#/components/schemas/TraceId' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        path: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        reason: { type: string, minLength: 1 }
        retryable: { type: boolean }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
        parseJobId: { type: [string, 'null'], format: uuid }
        failedElementId: { type: [string, 'null'], format: uuid }
      additionalProperties: false
