openapi: 3.1.0
info:
  title: GRC Knowledge Engine API
  version: "1.0"
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  description: |
    知识库、构建、检索和证据访问契约。目标接口使用 /api/v2/knowledge 与
    /open/v2/knowledge。/api/v1 下已发布的三个 v0.4 端点仅用于兼容窗口。
    jobId 只表示执行状态，不能选择正文、Chunk、Asset 或 Evidence 版本。
servers:
  - url: https://knowledge.grc.internal
security:
  - bearerAuth: []
    accessContext: []
tags:
  - {name: knowledge-bases, description: 知识库生命周期、配置和统计。}
  - {name: documents, description: 文档、解析视图、Leaf Chunk 与增强产物。}
  - {name: build-jobs, description: 构建任务的创建、查询、重试和取消。}
  - {name: retrieval, description: 检索、Evidence 和媒体短期访问。}
  - {name: open-api, description: PAT 认证的三个开放能力。}
  - {name: operations, description: 存活与就绪探针。}
paths:
  /api/v1/knowledge/knowledge-bases:
    get:
      deprecated: true
      tags: [knowledge-bases]
      summary: 兼容 v0.4 的知识库列表
      operationId: listKnowledgeBasesV1
      parameters:
        - {name: directoryId, in: query, schema: {type: integer}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: v0.4 兼容响应, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyListResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      deprecated: true
      tags: [knowledge-bases]
      summary: 兼容 v0.4 的创建知识库
      operationId: createKnowledgeBaseV1
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyCreateRequest'}}}}
      responses:
        '200': {description: v0.4 兼容响应, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/knowledge/knowledge-bases/{knowledgeBaseId}:
    get:
      deprecated: true
      tags: [knowledge-bases]
      summary: 兼容 v0.4 的知识库详情
      operationId: getKnowledgeBaseV1
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      responses:
        '200': {description: v0.4 兼容响应, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/knowledge/tags:
    get:
      deprecated: true
      tags: [knowledge-bases]
      summary: 兼容 v0.4 的知识库标签列表
      operationId: listKnowledgeTagsV1
      responses:
        '200': {description: v0.4 兼容响应, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyKnowledgeTagListResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      deprecated: true
      tags: [knowledge-bases]
      summary: 兼容 v0.4 的创建知识库标签
      operationId: createKnowledgeTagV1
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateKnowledgeTagRequest'}}}}
      responses:
        '200': {description: v0.4 兼容响应, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyKnowledgeTagResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v2/knowledge/tags:
    get:
      tags: [knowledge-bases]
      summary: 查询知识库标签
      operationId: listKnowledgeTags
      responses:
        '200': {$ref: '#/components/responses/KnowledgeTagListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [knowledge-bases]
      summary: 创建知识库标签
      operationId: createKnowledgeTag
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateKnowledgeTagRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/KnowledgeTagResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v2/knowledge/knowledge-bases/pipeline-options:
    get:
      tags: [knowledge-bases]
      summary: 查询业务参数选项和运行能力
      operationId: getPipelineOptions
      responses:
        '200': {$ref: '#/components/responses/PipelineOptionsResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v2/knowledge/knowledge-bases:
    get:
      tags: [knowledge-bases]
      summary: 查询调用者可见的知识库
      operationId: listKnowledgeBases
      parameters:
        - {name: directoryId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/KnowledgeBaseStatus'}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 255}}
        - {name: retrievalReady, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBasePageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [knowledge-bases]
      summary: 创建草稿知识库
      operationId: createKnowledgeBase
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateKnowledgeBaseRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}:
    get:
      tags: [knowledge-bases]
      summary: 获取知识库详情
      operationId: getKnowledgeBase
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '304': {description: ETag 未变化}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/update:
    post:
      tags: [knowledge-bases]
      summary: 更新知识库基础信息
      operationId: updateKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateKnowledgeBaseRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/pipeline-config:
    post:
      tags: [knowledge-bases]
      summary: 更新业务可调管线配置并触发重建
      operationId: updatePipelineConfig
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePipelineConfigRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/PipelineUpdateResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/enable:
    post:
      tags: [knowledge-bases]
      summary: 重新启用已停用知识库
      description: 仅允许 DISABLED 到 ACTIVE；DRAFT 由首份 READY 文档自动激活。
      operationId: enableKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/publish:
    post:
      tags: [knowledge-bases]
      summary: 发布已具备可检索内容的草稿知识库
      description: 对应 mgmt publish 门面；只允许 DRAFT 到 ACTIVE，且至少存在一个 active READY 文档。
      operationId: publishKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/offline:
    post:
      tags: [knowledge-bases]
      summary: 立即停用知识库消费面
      operationId: disableKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/delete:
    post:
      tags: [knowledge-bases]
      summary: 删除知识库并开始不可恢复清理
      operationId: deleteKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/PurgeResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/stats:
    get:
      tags: [knowledge-bases]
      summary: 获取构建和清理统计
      operationId: getKnowledgeBaseStats
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      responses:
        '200': {$ref: '#/components/responses/KnowledgeBaseStatsResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/imports:
    post:
      tags: [documents]
      summary: 批量导入文档并可自动构建
      operationId: importDocuments
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentImportRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/DocumentImportResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents:
    get:
      tags: [documents]
      summary: 查询 active manifest 下的逻辑文档
      operationId: listDocuments
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/DocumentStatus'}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 255}}
        - {name: sourceType, in: query, schema: {type: string, maxLength: 64}}
        - {name: retrievalReady, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/DocumentPageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/document-stage-config-batches:
    post:
      tags: [documents]
      summary: 批量更新所选文档的 parser/chunking/enhance 覆盖
      operationId: batchUpdateDocumentStageConfig
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BatchDocumentStageConfigRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/BuildJobResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}:
    get:
      tags: [documents]
      summary: 获取 active 文档版本详情
      operationId: getDocument
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
      responses:
        '200': {$ref: '#/components/responses/DocumentResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/stage-config:
    post:
      tags: [documents]
      summary: 更新文档 parser/chunking/enhance 覆盖
      operationId: updateDocumentStageConfig
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentStageOverride'}}}}
      responses:
        '202': {$ref: '#/components/responses/BuildJobResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/parse:
    get:
      tags: [documents]
      summary: 获取 active 文档解析视图
      operationId: getDocumentParseView
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
      responses:
        '200': {$ref: '#/components/responses/ParseViewResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/pages/{page}:
    get:
      tags: [documents]
      summary: 获取文档指定页的前端工作台聚合数据
      description: 聚合 active DocumentVersion 的解析内容、Leaf Chunk、摘要关键词和解析信息；不按 jobId 选择事实版本。
      operationId: getDocumentPageWorkspace
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/PageNumberPath'}
      responses:
        '200': {$ref: '#/components/responses/PageWorkspaceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/chunks:
    get:
      tags: [documents]
      summary: 查询 active 文档的 Leaf Chunk
      operationId: listLeafChunks
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {name: keyword, in: query, schema: {type: string, maxLength: 255}}
        - {name: snippetContext, in: query, schema: {type: integer, minimum: 0, maximum: 10, default: 0}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/ChunkPageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/chunks/{chunkId}:
    get:
      tags: [documents]
      summary: 获取 active Leaf Chunk 详情
      operationId: getLeafChunk
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/ChunkId'}
        - {name: snippetContext, in: query, schema: {type: integer, minimum: 0, maximum: 10, default: 0}}
      responses:
        '200': {$ref: '#/components/responses/ChunkResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/chunks/{chunkId}/update:
    post:
      tags: [documents]
      summary: 写时复制编辑 Leaf 并从增强阶段重建
      operationId: updateLeafChunk
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/ChunkId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateChunkRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/ChunkMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/chunks/{chunkId}/delete:
    post:
      tags: [documents]
      summary: 删除 Leaf 并立即退出检索
      operationId: deleteLeafChunk
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/ChunkId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/PurgeResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/enhance/{enhanceType}:
    get:
      tags: [documents]
      summary: 查询 active Leaf 增强产物
      operationId: listEnhancements
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {name: enhanceType, in: path, required: true, schema: {type: string, enum: [SUMMARY, KEYWORDS, FAQ]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/EnhancementPageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/original-url:
    post:
      tags: [documents]
      summary: 签发原文短期 URL
      operationId: createOriginalDocumentUrl
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CreateAccessUrlRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/AccessUrlResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents/{documentId}/delete:
    post:
      tags: [documents]
      summary: 删除文档并开始不可恢复清理
      operationId: deleteDocument
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/PurgeResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /api/v2/knowledge/knowledge-bases/{knowledgeBaseId}/build-jobs:
    get:
      tags: [build-jobs]
      summary: 查询知识库构建历史
      operationId: listBuildJobs
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/BuildJobPageResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [build-jobs]
      summary: 创建文档或全库构建任务
      operationId: createBuildJob
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBuildJobRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/BuildJobResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v2/knowledge/jobs/{jobId}:
    get:
      tags: [build-jobs]
      summary: 获取构建任务运维状态
      operationId: getBuildJob
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        '200': {$ref: '#/components/responses/BuildJobResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/jobs/{jobId}/retry:
    post:
      tags: [build-jobs]
      summary: 从失败阶段重试构建任务
      operationId: retryBuildJob
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/BuildJobResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/knowledge/jobs/{jobId}/cancel:
    post:
      tags: [build-jobs]
      summary: 取消尚未提交的 candidate
      operationId: cancelBuildJob
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/BuildJobResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v2/knowledge/retrievals:
    post:
      tags: [retrieval]
      summary: 在授权范围内执行多知识库检索
      operationId: retrieveKnowledge
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetrievalRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/RetrievalResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v2/knowledge/artifacts/access-urls:
    post:
      tags: [retrieval]
      summary: 批量签发或刷新证据媒体短期 URL
      operationId: createArtifactAccessUrls
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateArtifactAccessUrlsRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ArtifactAccessUrlsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/knowledge/operations/{operationId}:
    get:
      tags: [operations]
      summary: 查询不可恢复清理操作状态
      operationId: getPurgeOperation
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {$ref: '#/components/responses/PurgeResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /open/v2/knowledge/knowledge-bases/{knowledgeBaseId}:
    get:
      tags: [open-api]
      summary: 通过 PAT 查询知识库元数据
      operationId: getOpenKnowledgeBase
      security: [{patBearer: []}]
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      responses:
        '200': {$ref: '#/components/responses/OpenKnowledgeBaseResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /open/v2/knowledge/retrievals:
    post:
      tags: [open-api]
      summary: 通过 PAT scope 执行检索
      description: 请求体禁止 knowledgeBaseIds 和 documentIds，资源范围完全来自 PAT scope。
      operationId: retrieveOpenKnowledge
      security: [{patBearer: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpenRetrievalRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/RetrievalResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /open/v2/knowledge/knowledge-bases/{knowledgeBaseId}/documents:
    post:
      tags: [open-api]
      summary: 通过 PAT 更新单份文档并自动构建
      operationId: updateOpenKnowledgeDocument
      security: [{patBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpenDocumentUpdateRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/DocumentImportResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /health:
    get:
      tags: [operations]
      summary: 存活探针
      operationId: getKnowledgeHealth
      security: []
      responses:
        '200': {$ref: '#/components/responses/HealthResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /readyz:
    get:
      tags: [operations]
      summary: 就绪探针
      operationId: getKnowledgeReadiness
      security: []
      responses:
        '200': {$ref: '#/components/responses/ReadinessResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ReadinessResponse'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT or service token}
    patBearer: {type: http, scheme: bearer, bearerFormat: PAT}
    accessContext:
      type: apiKey
      in: header
      name: X-GRC-Access-Context
      description: 受众、方法、路径和 bodyHash 绑定的短期 compact JWS；网关剥离外部伪造值。
  parameters:
    KnowledgeBaseId: {name: knowledgeBaseId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    DocumentId: {name: documentId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    JobId: {name: jobId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ChunkId: {name: chunkId, in: path, required: true, schema: {type: string, format: uuid}}
    OperationId: {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    PageNumberPath: {name: page, in: path, required: true, schema: {type: integer, minimum: 1}}
    IdempotencyKey: {name: X-Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 3, maxLength: 128}}
  responses:
    PipelineOptionsResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/PipelineOptionsEnvelope'}}}}
    KnowledgeBaseResponse: {description: 成功, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseEnvelope'}}}}
    KnowledgeBasePageResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBasePageEnvelope'}}}}
    KnowledgeBaseStatsResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseStatsEnvelope'}}}}
    KnowledgeTagResponse: {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeTagEnvelope'}}}}
    KnowledgeTagListResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeTagListEnvelope'}}}}
    PipelineUpdateResponse: {description: 已接受重建, content: {application/json: {schema: {$ref: '#/components/schemas/PipelineUpdateEnvelope'}}}}
    DocumentImportResponse: {description: 整体请求有效；逐项结果保持输入顺序, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentImportEnvelope'}}}}
    DocumentPageResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentPageEnvelope'}}}}
    DocumentResponse: {description: 成功, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentEnvelope'}}}}
    ParseViewResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ParseViewEnvelope'}}}}
    PageWorkspaceResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/PageWorkspaceEnvelope'}}}}
    ChunkPageResponse: {description: records 仅包含 Leaf, content: {application/json: {schema: {$ref: '#/components/schemas/ChunkPageEnvelope'}}}}
    ChunkResponse: {description: 成功, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ChunkEnvelope'}}}}
    ChunkMutationResponse: {description: 已接受写时复制, content: {application/json: {schema: {$ref: '#/components/schemas/ChunkMutationEnvelope'}}}}
    EnhancementPageResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/EnhancementPageEnvelope'}}}}
    BuildJobResponse: {description: jobId 仅用于运维状态, content: {application/json: {schema: {$ref: '#/components/schemas/BuildJobEnvelope'}}}}
    BuildJobPageResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/BuildJobPageEnvelope'}}}}
    RetrievalResponse: {description: rank 为 1-based，score 为原始小数, content: {application/json: {schema: {$ref: '#/components/schemas/RetrievalEnvelope'}}}}
    PurgeResponse: {description: 已不可见；Milvus 确认后立即清理且无恢复窗口, content: {application/json: {schema: {$ref: '#/components/schemas/PurgeEnvelope'}}}}
    AccessUrlResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AccessUrlEnvelope'}}}}
    ArtifactAccessUrlsResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactAccessUrlsEnvelope'}}}}
    OpenKnowledgeBaseResponse: {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/OpenKnowledgeBaseEnvelope'}}}}
    HealthResponse: {description: 存活, content: {application/json: {schema: {$ref: '#/components/schemas/HealthEnvelope'}}}}
    ReadinessResponse: {description: 就绪状态, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessEnvelope'}}}}
    BadRequest: {$ref: '#/components/responses/ProblemResponse'}
    Unauthorized: {$ref: '#/components/responses/ProblemResponse'}
    Forbidden: {$ref: '#/components/responses/ProblemResponse'}
    NotFound: {$ref: '#/components/responses/ProblemResponse'}
    Conflict: {$ref: '#/components/responses/ProblemResponse'}
    PreconditionFailed: {$ref: '#/components/responses/ProblemResponse'}
    Unprocessable: {$ref: '#/components/responses/ProblemResponse'}
    PreconditionRequired: {$ref: '#/components/responses/ProblemResponse'}
    InternalError: {$ref: '#/components/responses/ProblemResponse'}
    DependencyUnavailable: {$ref: '#/components/responses/ProblemResponse'}
    RateLimited:
      description: 请求被限流
      headers: {Retry-After: {schema: {type: integer, minimum: 1}}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
    ProblemResponse:
      description: 标准错误响应；HTTP 状态由 operation 定义
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
  schemas:
    SuccessBase:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: {type: string, const: "0"}
        message: {type: string, const: success}
        traceId: {type: string, minLength: 16, maxLength: 64}
        timestamp: {type: string, format: date-time}
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9]{1,5}-[1-9][0-9]{3}$', description: 业务错误使用 KB；认证/网关错误可使用 AUTH/GW。}
        message: {type: string, minLength: 1, maxLength: 512}
        detail: {type: [string, 'null'], maxLength: 4000}
        traceId: {type: string, minLength: 16, maxLength: 64}
        timestamp: {type: string, format: date-time}
        path: {type: string, maxLength: 2048}
        status: {type: integer, minimum: 400, maximum: 599}
        reason: {type: string, maxLength: 64}
        retryable: {type: boolean}
        retryAfterSeconds: {type: [integer, 'null'], minimum: 1}
        resource: {$ref: '#/components/schemas/ResourceReference'}
    ResourceReference:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, enum: [KNOWLEDGE_BASE, DOCUMENT, CHUNK, BUILD_JOB, ASSET, GENERATION]}
        id: {type: string, minLength: 1, maxLength: 128}
    KnowledgeBaseStatus: {type: string, enum: [DRAFT, ACTIVE, DISABLED]}
    DocumentStatus: {type: string, enum: [UNPARSED, PARSED, CHUNKED, ENHANCED, VECTORIZED, BUILD_FAILED, DELETED]}
    BuildStage: {type: string, enum: [PARSE, CHUNK, ENHANCE, EMBED]}
    PurgeStatus: {type: string, enum: [NONE, PENDING, RUNNING, SUCCEEDED, FAILED]}
    ParserConfig:
      type: object
      additionalProperties: false
      required: [type, parseMethod, language, tableEnabled, formulaEnabled, imageMode]
      properties:
        type: {type: string, enum: [DOCLING, MINERU, DEEPDOC]}
        parseMethod: {type: string, enum: [TEXT, OCR]}
        language: {type: string, enum: [AUTO, ZH, EN, ZH_EN, JA]}
        tableEnabled: {type: boolean}
        formulaEnabled: {type: boolean}
        imageMode: {type: string, enum: [IGNORE, EXTRACT_NO_OCR, EXTRACT_AND_OCR]}
    ChunkingConfig:
      type: object
      additionalProperties: false
      required: [type, chunkSize, chunkOverlap]
      properties:
        type: {type: string, enum: [FIXED, SEMANTIC, PARENT, HIERARCHICAL]}
        chunkSize: {type: integer, minimum: 256, maximum: 1024}
        chunkOverlap: {type: integer, minimum: 0, maximum: 256, description: 必须小于 chunkSize。}
    EnhanceItemConfig:
      type: object
      additionalProperties: false
      required: [enabled, language]
      properties:
        enabled: {type: boolean}
        language: {type: string, enum: [AUTO, ZH, EN]}
        maxLength: {type: integer, minimum: 50, maximum: 2000}
        maxKeywords: {type: integer, minimum: 3, maximum: 10}
        maxPairs: {type: integer, minimum: 1, maximum: 5}
    EnhanceConfig:
      type: object
      additionalProperties: false
      required: [summary, keywords, faq]
      properties:
        summary: {$ref: '#/components/schemas/EnhanceItemConfig'}
        keywords: {$ref: '#/components/schemas/EnhanceItemConfig'}
        faq: {$ref: '#/components/schemas/EnhanceItemConfig'}
    EmbeddingConfig:
      type: object
      additionalProperties: false
      required: [model]
      properties: {model: {type: string, enum: [BGE_M3, TEXT_EMBEDDING_3_LARGE, VOYAGE_3, QWEN]}}
    VectorStoreConfig:
      type: object
      additionalProperties: false
      required: [backend, resourceId]
      properties:
        backend: {type: string, enum: [MILVUS, PGVECTOR], description: PGVECTOR 保留入口，当前 available=false。}
        resourceId: {type: string, minLength: 1, maxLength: 128}
    RerankConfig:
      type: object
      additionalProperties: false
      required: [enabled, topN]
      properties:
        enabled: {type: boolean}
        topN: {type: integer, minimum: 1, maximum: 50, description: 必须不大于 topK。}
    RetrievalConfig:
      type: object
      additionalProperties: false
      required: [strategy, topK, rerank]
      properties:
        strategy: {type: string, enum: [VECTOR, HYBRID, AGENTIC]}
        topK: {type: integer, minimum: 1, maximum: 100}
        rerank: {$ref: '#/components/schemas/RerankConfig'}
    BusinessPipelineConfig:
      type: object
      additionalProperties: false
      required: [parser, chunking, enhance, embedding, vectorStore, retrieval]
      properties:
        parser: {$ref: '#/components/schemas/ParserConfig'}
        chunking: {$ref: '#/components/schemas/ChunkingConfig'}
        enhance: {$ref: '#/components/schemas/EnhanceConfig'}
        embedding: {$ref: '#/components/schemas/EmbeddingConfig'}
        vectorStore: {$ref: '#/components/schemas/VectorStoreConfig'}
        retrieval: {$ref: '#/components/schemas/RetrievalConfig'}
    DocumentStageOverride:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        parser: {$ref: '#/components/schemas/ParserConfig'}
        chunking: {$ref: '#/components/schemas/ChunkingConfig'}
        enhance: {$ref: '#/components/schemas/EnhanceConfig'}
    BatchDocumentStageConfigRequest:
      type: object
      additionalProperties: false
      required: [documentIds, stageOverride]
      properties:
        documentIds: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        stageOverride: {$ref: '#/components/schemas/DocumentStageOverride'}
    KnowledgeTag:
      type: object
      additionalProperties: false
      required: [tagId, name]
      properties:
        tagId: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 64}
    CreateKnowledgeTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
    KnowledgeTagList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/KnowledgeTag'}}
    CreateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [directoryId, name, pipelineConfig]
      properties:
        directoryId: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null'], maxLength: 4000}
        tags: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        visibility: {type: string, enum: [PRIVATE, PUBLIC], default: PRIVATE}
        pipelineConfig: {$ref: '#/components/schemas/BusinessPipelineConfig'}
    UpdateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null'], maxLength: 4000}
        tags: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        visibility: {type: string, enum: [PRIVATE, PUBLIC]}
    UpdatePipelineConfigRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: P0 禁止修改 embedding 和 vectorStore。
      properties:
        parser: {$ref: '#/components/schemas/ParserConfig'}
        chunking: {$ref: '#/components/schemas/ChunkingConfig'}
        enhance: {$ref: '#/components/schemas/EnhanceConfig'}
        retrieval: {$ref: '#/components/schemas/RetrievalConfig'}
    EffectiveConfigSummary:
      type: object
      additionalProperties: false
      required: [businessConfig, managedProfiles, embedding, vectorStore, configFingerprint]
      properties:
        businessConfig: {$ref: '#/components/schemas/BusinessPipelineConfig'}
        managedProfiles: {type: object, additionalProperties: {type: string}}
        embedding:
          type: object
          required: [model, dimension, fingerprint]
          properties:
            model: {type: string}
            modelVersionLabel: {type: string}
            dimension: {type: integer, minimum: 1}
            fingerprint: {type: string}
        vectorStore:
          type: object
          required: [backend, resourceId, resourceName, available]
          properties:
            backend: {type: string, enum: [MILVUS, PGVECTOR]}
            resourceId: {type: string}
            resourceName: {type: string}
            available: {type: boolean}
            metricLabel: {type: string}
        configFingerprint: {type: string, minLength: 16, maxLength: 128}
    KnowledgeBaseSummary:
      type: object
      required: [knowledgeBaseId, directoryId, name, tags, visibility, status, retrievalReady, hasFailedDocuments, documentCount, vectorizedDocumentCount, createdAt, updatedAt]
      properties:
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        directoryId: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        description: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        visibility: {type: string, enum: [PRIVATE, PUBLIC]}
        status: {$ref: '#/components/schemas/KnowledgeBaseStatus'}
        retrievalReady: {type: boolean}
        hasFailedDocuments: {type: boolean}
        documentCount: {type: integer, minimum: 0}
        vectorizedDocumentCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KnowledgeBaseStats:
      type: object
      additionalProperties: false
      required: [documentCount, vectorizedDocumentCount, failedDocumentCount, activeLeafCount, vectorCount, projectionReadyCount, readinessPercent, purgeStatus]
      properties:
        documentCount: {type: integer, minimum: 0}
        vectorizedDocumentCount: {type: integer, minimum: 0}
        failedDocumentCount: {type: integer, minimum: 0}
        activeLeafCount: {type: integer, minimum: 0}
        vectorCount: {type: integer, minimum: 0, description: 仅 Leaf 的 LEAF_TEXT 向量数。}
        projectionReadyCount: {type: integer, minimum: 0}
        readinessPercent: {type: number, minimum: 0, maximum: 100}
        latestBuildAt: {type: [string, 'null'], format: date-time}
        purgeStatus: {$ref: '#/components/schemas/PurgeStatus'}
    KnowledgeBaseDetail:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/KnowledgeBaseSummary'}
        - type: object
          required: [effectiveConfig, stats, activeDocumentCount, activeLeafCount, vectorCount, projectionReadyCount, purgeStatus]
          properties:
            effectiveConfig: {$ref: '#/components/schemas/EffectiveConfigSummary'}
            stats: {$ref: '#/components/schemas/KnowledgeBaseStats'}
            activeGenerationId: {type: [string, 'null'], format: uuid}
            activeDocumentCount: {type: integer, minimum: 0}
            activeLeafCount: {type: integer, minimum: 0}
            vectorCount: {type: integer, minimum: 0}
            projectionReadyCount: {type: integer, minimum: 0}
            latestBuildStatus: {type: [string, 'null']}
            rebuildLock: {type: [string, 'null']}
            purgeStatus: {$ref: '#/components/schemas/PurgeStatus'}
    PipelineCapability:
      type: object
      additionalProperties: false
      required: [value, label, available, editableFields]
      properties:
        value: {type: string}
        label: {type: string}
        available: {type: boolean}
        reason: {type: string}
        editableFields: {type: array, items: {type: string}}
        defaultValue: {}
        constraints: {type: object, additionalProperties: true}
    PipelineOptions:
      type: object
      additionalProperties: false
      required: [schemaVersion, parser, chunking, enhance, embedding, vectorStore, retrieval]
      properties:
        schemaVersion: {type: string}
        parser: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
        chunking: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
        enhance: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
        embedding: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
        vectorStore: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
        retrieval: {type: array, items: {$ref: '#/components/schemas/PipelineCapability'}}
    PipelineUpdateResult:
      type: object
      additionalProperties: false
      required: [affectedDocuments, rebuildRequired, effectScope]
      properties:
        jobId: {type: integer, format: int64, minimum: 1}
        affectedDocuments: {type: integer, minimum: 0}
        rebuildRequired: {type: boolean}
        effectScope:
          type: string
          enum: [future-builds-only, rebuild-required]
          description: 未产生可检索事实时仅影响未来构建；已有 active Generation 且检索相关配置变化时必须重建。
        fromStage: {$ref: '#/components/schemas/BuildStage'}
    SourceAccessGrant:
      type: object
      additionalProperties: false
      required: [grantId, accessUrl, expiresAt, audience, maxUses]
      properties:
        grantId: {type: string, minLength: 1, maxLength: 256}
        accessUrl: {type: string, format: uri, maxLength: 4096, writeOnly: true}
        expiresAt: {type: string, format: date-time}
        audience: {type: string, const: grc-knowledge-engine}
        maxUses: {type: integer, const: 1}
    PageRange:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: {type: integer, minimum: 1}
        end: {type: integer, minimum: 1}
    DocumentImportItem:
      type: object
      additionalProperties: false
      required: [clientItemId, fileId, fileName, mediaType, byteSize, contentHash, sourceAccessGrant]
      properties:
        clientItemId: {type: string, minLength: 1, maxLength: 128}
        fileId: {type: string, minLength: 1, maxLength: 256}
        fileName: {type: string, minLength: 1, maxLength: 255}
        mediaType: {type: string, minLength: 1, maxLength: 255}
        byteSize: {type: integer, minimum: 1, maximum: 41943040}
        contentHash: {type: string, pattern: '^sha256:[a-fA-F0-9]{64}$'}
        sourceAccessGrant: {$ref: '#/components/schemas/SourceAccessGrant'}
        pageRange: {oneOf: [{$ref: '#/components/schemas/PageRange'}, {type: 'null'}]}
    DocumentImportRequest:
      type: object
      additionalProperties: false
      required: [sourceType, items, duplicatePolicy, autoBuild]
      properties:
        sourceType: {type: string, enum: [FILE, CONFLUENCE, SHAREPOINT, ONEDRIVE, S3, AZURE_BLOB]}
        items: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/DocumentImportItem'}}
        duplicatePolicy: {type: string, enum: [REJECT, OVERWRITE]}
        autoBuild: {type: boolean}
        documentOverride: {oneOf: [{$ref: '#/components/schemas/DocumentStageOverride'}, {type: 'null'}]}
    DocumentImportItemResult:
      type: object
      additionalProperties: false
      required: [clientItemId, status]
      properties:
        clientItemId: {type: string}
        documentId: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [ACCEPTED, REJECTED]}
        reason: {type: string}
        errorCode: {type: string}
    DocumentImportResult:
      type: object
      additionalProperties: false
      required: [operationId, accepted, rejected]
      properties:
        operationId: {type: string, format: uuid}
        batchJobId: {type: integer, format: int64, minimum: 1}
        accepted: {type: array, items: {$ref: '#/components/schemas/DocumentImportItemResult'}}
        rejected: {type: array, items: {$ref: '#/components/schemas/DocumentImportItemResult'}}
    BuildStageStatus:
      type: object
      additionalProperties: false
      required: [stage, status, attempt]
      properties:
        stage: {$ref: '#/components/schemas/BuildStage'}
        status: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SKIPPED, CANCELLED]}
        attempt: {type: integer, minimum: 0}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null']}
    DocumentSummary:
      type: object
      required: [documentId, knowledgeBaseId, fileName, mediaType, byteSize, sourceType, status, retrievalReady, createdAt, updatedAt]
      properties:
        documentId: {type: integer, format: int64, minimum: 1}
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        fileName: {type: string}
        mediaType: {type: string}
        byteSize: {type: integer, minimum: 0}
        sourceType: {type: string}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        failedStage: {oneOf: [{$ref: '#/components/schemas/BuildStage'}, {type: 'null'}]}
        errorCode: {type: [string, 'null']}
        retrievalReady: {type: boolean}
        chunkCount: {type: integer, minimum: 0}
        activeDocumentVersionId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentProjection:
      type: object
      additionalProperties: false
      required: [projectionId, documentVersionId, state, keywords, inputSetHash, createdAt]
      properties:
        projectionId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        state: {type: string, enum: [READY, DISABLED, EMPTY, INVALIDATED]}
        summary: {type: [string, 'null']}
        keywords: {type: array, items: {type: string}}
        inputSetHash: {type: string}
        createdAt: {type: string, format: date-time}
    DocumentDetail:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/DocumentSummary'}
        - type: object
          required: [documentVersionId, stages, effectiveConfig]
          properties:
            documentVersionId: {type: string, format: uuid}
            stages: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/BuildStageStatus'}}
            effectiveConfig: {$ref: '#/components/schemas/EffectiveConfigSummary'}
            projection: {oneOf: [{$ref: '#/components/schemas/DocumentProjection'}, {type: 'null'}]}
            latestBuild: {oneOf: [{$ref: '#/components/schemas/BuildJobSummary'}, {type: 'null'}]}
            sourcePreviewAction: {type: [string, 'null']}
    BoundingBox:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: {type: number}
        y: {type: number}
        width: {type: number, minimum: 0}
        height: {type: number, minimum: 0}
    AssetSummary:
      type: object
      additionalProperties: false
      required: [assetId, assetType, sourceElementId, mediaType, descriptionStatus, availableRenditions, accessStatus]
      properties:
        assetId: {type: string, format: uuid}
        assetType: {type: string, enum: [IMAGE, CHART, TABLE_RENDER, ILLUSTRATION, ATTACHMENT]}
        sourceElementId: {type: string, format: uuid}
        mediaType: {type: string}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        pageIndex: {type: [integer, 'null'], minimum: 1}
        bbox: {oneOf: [{$ref: '#/components/schemas/BoundingBox'}, {type: 'null'}]}
        caption: {type: [string, 'null']}
        descriptionStatus: {type: string, enum: [READY, SKIPPED, FAILED]}
        availableRenditions: {type: array, items: {type: string, enum: [ORIGINAL, THUMBNAIL, PREVIEW]}}
        accessStatus: {type: string, enum: [AVAILABLE, GONE, FORBIDDEN]}
    DocumentParseView:
      type: object
      additionalProperties: false
      required: [documentId, documentVersionId, parserFingerprint, content, outline, pageCount, hasPageLayout, assets, warnings]
      properties:
        documentId: {type: integer, format: int64}
        documentVersionId: {type: string, format: uuid}
        parserFingerprint: {type: string}
        content: {$ref: '#/components/schemas/ContentAction'}
        outline: {type: array, items: {$ref: '#/components/schemas/OutlineItem'}}
        pageCount: {type: integer, minimum: 0}
        hasPageLayout: {type: boolean}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetSummary'}}
        warnings: {type: array, maxItems: 1000, items: {type: string}}
    PageParseElement:
      type: object
      additionalProperties: false
      required: [elementId, elementType, content, page]
      properties:
        elementId: {type: string, format: uuid}
        elementType: {type: string, enum: [TITLE, PARAGRAPH, LIST, TABLE, FORMULA, IMAGE, CHART, HEADER, FOOTER, OTHER]}
        content: {type: string}
        page: {type: integer, minimum: 1}
        bbox: {oneOf: [{$ref: '#/components/schemas/BoundingBox'}, {type: 'null'}]}
        assetId: {type: [string, 'null'], format: uuid}
    PageParseContent:
      type: object
      additionalProperties: false
      required: [contentAction, elements]
      properties:
        markdown: {type: [string, 'null'], description: 体量允许时可内联返回；否则为 null 并通过 contentAction 获取。}
        contentAction: {$ref: '#/components/schemas/ContentAction'}
        elements: {type: array, items: {$ref: '#/components/schemas/PageParseElement'}}
    PageSummaryAndTags:
      type: object
      additionalProperties: false
      required: [summary, keywords]
      properties:
        summary: {type: [string, 'null']}
        keywords: {type: array, items: {type: string, maxLength: 256}}
    PageParseInfo:
      type: object
      additionalProperties: false
      required: [documentVersionId, parserFingerprint, pageCount, hasPageLayout]
      properties:
        documentVersionId: {type: string, format: uuid}
        parserFingerprint: {type: string, minLength: 1, maxLength: 512}
        pageCount: {type: integer, minimum: 0}
        hasPageLayout: {type: boolean}
    DocumentPageWorkspace:
      type: object
      additionalProperties: false
      required: [page, parseContent, chunks, summaryAndTags, parseInfo]
      properties:
        page: {type: integer, minimum: 1}
        parseContent: {$ref: '#/components/schemas/PageParseContent'}
        chunks:
          type: array
          description: 与该页有来源位置交集的 active DocumentVersion Leaf Chunk；父 Chunk 通过 parentContext 返回。
          items: {$ref: '#/components/schemas/ChunkDetail'}
        summaryAndTags: {$ref: '#/components/schemas/PageSummaryAndTags'}
        parseInfo: {$ref: '#/components/schemas/PageParseInfo'}
    ContentAction:
      type: object
      additionalProperties: false
      required: [mediaType, contentHash, action]
      properties:
        mediaType: {type: string}
        contentHash: {type: string}
        action: {type: string}
    OutlineItem:
      type: object
      additionalProperties: false
      required: [title, level]
      properties:
        title: {type: string}
        level: {type: integer, minimum: 1, maximum: 32}
        elementId: {type: string, format: uuid}
    ParentContext:
      type: object
      additionalProperties: false
      required: [content, sectionPath]
      properties:
        content: {type: string}
        sectionPath: {type: array, maxItems: 32, items: {type: string}}
    NeighborChunk:
      type: object
      additionalProperties: false
      required: [chunkId, sequence, content]
      properties:
        chunkId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 0}
        content: {type: string}
    ChunkDetail:
      type: object
      additionalProperties: false
      required: [chunkId, documentVersionId, type, sequence, content, tokenCount, charCount, contentHash, sectionPath, bboxes, neighbors, assets, version]
      properties:
        chunkId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        type: {type: string, const: LEAF}
        sequence: {type: integer, minimum: 0}
        content: {type: string, minLength: 1, maxLength: 1000000}
        tokenCount: {type: integer, minimum: 1}
        charCount: {type: integer, minimum: 1}
        contentHash: {type: string}
        sectionPath: {type: array, maxItems: 32, items: {type: string, maxLength: 512}}
        pageRange: {oneOf: [{$ref: '#/components/schemas/PageRange'}, {type: 'null'}]}
        bboxes: {type: array, items: {$ref: '#/components/schemas/BoundingBox'}}
        parentContext: {oneOf: [{$ref: '#/components/schemas/ParentContext'}, {type: 'null'}]}
        neighbors: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/NeighborChunk'}}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetSummary'}}
        enhancement: {type: [object, 'null']}
        version: {type: integer, minimum: 1}
    UpdateChunkRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 1000000}
        metadata:
          type: object
          additionalProperties: true
          description: 仅允许业务注释；documentVersionId、generationId、contentHash、页码、定位框等系统追溯字段不可覆盖。
    ChunkMutationResult:
      type: object
      additionalProperties: false
      required: [chunkId, content, newDocumentVersionId, jobId, rerunStages, tokenCount, droppedAssetRelations]
      properties:
        chunkId: {type: string, format: uuid}
        content: {type: string, minLength: 1, maxLength: 1000000}
        newDocumentVersionId: {type: string, format: uuid}
        jobId: {type: integer, format: int64, minimum: 1}
        rerunStages: {type: array, items: {$ref: '#/components/schemas/BuildStage'}}
        tokenCount: {type: integer, minimum: 1}
        droppedAssetRelations: {type: array, items: {type: string, format: uuid}}
    EnhancementItem:
      type: object
      additionalProperties: false
      required: [enhancementId, sourceChunkId, type, ordinal, content]
      properties:
        enhancementId: {type: string, format: uuid}
        sourceChunkId: {type: string, format: uuid}
        type: {type: string, enum: [SUMMARY, KEYWORDS, FAQ]}
        ordinal: {type: integer, minimum: 0}
        content: {description: "SUMMARY 为 string，KEYWORDS 为 string[]，FAQ 为 question/answer object。"}
    CreateBuildJobRequest:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties: {scope: {const: SELECTED}}
          then:
            required: [documentIds]
            properties: {documentIds: {minItems: 1}}
      properties:
        documentIds: {type: array, maxItems: 200, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        scope: {type: string, enum: [SELECTED, ALL_FAILED, ALL], default: SELECTED}
        runMode: {type: string, enum: [AUTO, STAGED], default: AUTO}
        fromStage: {$ref: '#/components/schemas/BuildStage'}
        documentOverride: {$ref: '#/components/schemas/DocumentStageOverride'}
        pageRange: {$ref: '#/components/schemas/PageRange'}
    BuildFailure:
      type: object
      additionalProperties: false
      required: [code, reason, retryable]
      properties:
        code: {type: string}
        reason: {type: string}
        retryable: {type: boolean}
        failedStage: {oneOf: [{$ref: '#/components/schemas/BuildStage'}, {type: 'null'}]}
        detail: {type: string}
    BuildJobSummary:
      type: object
      required: [jobId, knowledgeBaseId, generationId, status, totalDocuments, completedDocuments, failedDocuments, progress, createdAt]
      properties:
        jobId: {type: integer, format: int64, minimum: 1}
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        generationId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED]}
        totalDocuments: {type: integer, minimum: 0}
        completedDocuments: {type: integer, minimum: 0}
        failedDocuments: {type: integer, minimum: 0}
        progress: {type: number, minimum: 0, maximum: 1}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    BuildJob:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/BuildJobSummary'}
        - type: object
          required: [documentVersionIds, stages]
          properties:
            documentVersionIds: {type: array, maxItems: 200, items: {type: string, format: uuid}}
            stages: {type: array, items: {$ref: '#/components/schemas/BuildStageStatus'}}
            latestFailure: {oneOf: [{$ref: '#/components/schemas/BuildFailure'}, {type: 'null'}]}
    RetrievalFilters:
      type: object
      additionalProperties: false
      properties:
        mediaTypes: {type: array, maxItems: 20, items: {type: string}}
        sourceTypes: {type: array, maxItems: 20, items: {type: string}}
        tags: {type: array, maxItems: 20, items: {type: string}}
    RetrievalOptions:
      type: object
      additionalProperties: false
      properties:
        hydrate: {type: boolean, default: true}
        expandParent: {type: boolean, default: true}
        includeMetadata: {type: boolean, default: true}
    RetrievalRequest:
      type: object
      additionalProperties: false
      required: [query, knowledgeBaseIds]
      properties:
        query: {type: string, minLength: 1, maxLength: 8000}
        knowledgeBaseIds: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        documentIds: {type: array, maxItems: 200, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
        topK: {type: integer, minimum: 1, maximum: 100, default: 10}
        strategy: {type: string, enum: [VECTOR, HYBRID, AGENTIC]}
        filters: {$ref: '#/components/schemas/RetrievalFilters'}
        rerank: {$ref: '#/components/schemas/RerankConfig'}
        options: {$ref: '#/components/schemas/RetrievalOptions'}
    OpenRetrievalRequest:
      type: object
      additionalProperties: false
      required: [query]
      description: PAT 资源范围来自 scope；此 schema 故意不定义 knowledgeBaseIds/documentIds。
      properties:
        query: {type: string, minLength: 1, maxLength: 8000}
        topK: {type: integer, minimum: 1, maximum: 100, default: 10}
        strategy: {type: string, enum: [VECTOR, HYBRID, AGENTIC]}
        filters: {$ref: '#/components/schemas/RetrievalFilters'}
        rerank: {$ref: '#/components/schemas/RerankConfig'}
        options: {$ref: '#/components/schemas/RetrievalOptions'}
    Score:
      type: object
      additionalProperties: false
      required: [value, type, comparableScope]
      properties:
        value: {type: number, description: 原始小数，不是百分比或置信度。}
        type: {type: string, enum: [VECTOR_SIMILARITY, RERANK, RANK_FUSION]}
        comparableScope: {type: string, enum: [REQUEST, SAME_FINGERPRINT_ONLY]}
        sourceSimilarity: {type: number, description: 仅同 embedding fingerprint 范围可比较。}
    EvidenceLocation:
      type: object
      additionalProperties: false
      required: [sectionPath, bboxes]
      properties:
        sectionPath: {type: array, maxItems: 32, items: {type: string}}
        pageRange: {oneOf: [{$ref: '#/components/schemas/PageRange'}, {type: 'null'}]}
        bboxes: {type: array, items: {$ref: '#/components/schemas/BoundingBox'}}
    AssetEvidence:
      type: object
      additionalProperties: false
      required: [assetId, assetType, rendition, altText, accessStatus]
      properties:
        assetId: {type: string, format: uuid}
        assetType: {type: string}
        rendition: {type: string, enum: [ORIGINAL, THUMBNAIL, PREVIEW]}
        altText: {type: string, maxLength: 4000}
        accessStatus: {type: string, enum: [AVAILABLE, GONE, FORBIDDEN]}
        accessAction: {type: [string, 'null']}
    Evidence:
      type: object
      additionalProperties: false
      required: [evidenceId, rank, knowledgeBase, document, hit, context, location, score, assets, citation]
      properties:
        evidenceId: {type: string, format: uuid}
        rank: {type: integer, minimum: 1}
        knowledgeBase: {$ref: '#/components/schemas/EvidenceKnowledgeBase'}
        document: {$ref: '#/components/schemas/EvidenceDocument'}
        hit: {$ref: '#/components/schemas/EvidenceHit'}
        context: {$ref: '#/components/schemas/EvidenceContext'}
        location: {$ref: '#/components/schemas/EvidenceLocation'}
        score: {$ref: '#/components/schemas/Score'}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetEvidence'}}
        citation: {$ref: '#/components/schemas/Citation'}
    EvidenceKnowledgeBase:
      type: object
      additionalProperties: false
      required: [id, name]
      properties: {id: {type: integer, format: int64}, name: {type: string}}
    EvidenceDocument:
      type: object
      additionalProperties: false
      required: [id, versionId, name, mimeType]
      properties:
        id: {type: integer, format: int64}
        versionId: {type: string, format: uuid}
        name: {type: string}
        mimeType: {type: string}
    EvidenceHit:
      type: object
      additionalProperties: false
      required: [chunkId, content, sequence]
      properties:
        chunkId: {type: string, format: uuid}
        content: {type: string}
        sequence: {type: integer, minimum: 0}
    EvidenceContext:
      type: object
      additionalProperties: false
      required: [neighbors]
      properties:
        parent: {oneOf: [{$ref: '#/components/schemas/ParentContext'}, {type: 'null'}]}
        neighbors: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/NeighborChunk'}}
    Citation:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 512}
        openOriginalAction: {type: [string, 'null']}
    RetrievalResult:
      type: object
      additionalProperties: false
      required: [partial, degradedChannels, results]
      properties:
        partial: {type: boolean}
        degradedChannels: {type: array, items: {type: string}}
        results: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Evidence'}}
    PurgeOperation:
      type: object
      additionalProperties: false
      required: [visible, purgeStatus, operationId, resourceType, resourceId, startedAt]
      properties:
        visible: {type: boolean, const: false}
        purgeStatus: {$ref: '#/components/schemas/PurgeStatus'}
        operationId: {type: string, format: uuid}
        resourceType: {type: string, enum: [KNOWLEDGE_BASE, DOCUMENT, CHUNK, GENERATION]}
        resourceId: {type: string, minLength: 1, maxLength: 128}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        lastErrorCode: {type: [string, 'null']}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
    CreateAccessUrlRequest:
      type: object
      additionalProperties: false
      properties: {ttlSeconds: {type: integer, minimum: 30, maximum: 900, default: 300}}
    AccessUrl:
      type: object
      additionalProperties: false
      required: [url, mediaType, expiresAt, reusable]
      properties:
        url: {type: string, format: uri}
        mediaType: {type: string}
        fileName: {type: string}
        expiresAt: {type: string, format: date-time}
        reusable: {type: boolean, const: false}
    CreateArtifactAccessUrlsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [assetId, rendition]
            properties:
              assetId: {type: string, format: uuid}
              rendition: {type: string, enum: [ORIGINAL, THUMBNAIL, PREVIEW]}
        ttlSeconds: {type: integer, minimum: 30, maximum: 900, default: 300}
    ArtifactAccessUrlItem:
      type: object
      additionalProperties: false
      required: [assetId, rendition, status]
      properties:
        assetId: {type: string, format: uuid}
        rendition: {type: string}
        status: {type: string, enum: [AVAILABLE, GONE, FORBIDDEN]}
        mediaType: {type: string}
        url: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
        errorCode: {type: string}
    OpenKnowledgeBase:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, name, description, documentCount, embeddingModel, dimensions]
      properties:
        knowledgeBaseId: {type: integer, format: int64}
        name: {type: string}
        description: {type: [string, 'null']}
        documentCount: {type: integer, minimum: 0}
        embeddingModel: {type: string}
        dimensions: {type: integer, minimum: 1}
        lastBuildAt: {type: [string, 'null'], format: date-time}
    OpenDocumentUpdateRequest:
      type: object
      additionalProperties: false
      required: [sourceType, item, duplicatePolicy]
      properties:
        sourceType: {type: string, const: FILE}
        item: {$ref: '#/components/schemas/DocumentImportItem'}
        duplicatePolicy: {type: string, enum: [REJECT, OVERWRITE]}
        documentOverride: {oneOf: [{$ref: '#/components/schemas/DocumentStageOverride'}, {type: 'null'}]}
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, mode]
      properties:
