          minItems: 1
          title: Docids
      additionalProperties: false
      type: object
      required:
        - stageConfig
        - docIds
      title: BatchUpdateDocumentStageConfigRequest
    CreateKnowledgeBaseRequest:
      properties:
        directoryId:
